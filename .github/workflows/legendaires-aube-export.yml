name: Générer l’export du lot Légendaire Aube
on:
  push:
    branches: [feat/evolutions-legendaires-aube]
    paths: [.github/workflows/legendaires-aube-export.yml]
permissions:
  contents: write
jobs:
  export:
    if: github.repository == 'floiaassistant-design/couronne-et-arcanes' && github.ref == 'refs/heads/feat/evolutions-legendaires-aube'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Générer uniquement l’export vérifié de cette branche
        run: |
          npm run build
          test "$(git hash-object JOUER.html)" = "21224fe275f8a6f5db63a39f575f309c96a2f6eb"
          git fetch origin feat/evolutions-legendaires-aube
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          if git diff --quiet -- JOUER.html; then exit 0; fi
          test "$(git diff --name-only)" = "JOUER.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOUER.html
          git commit -m "build: synchroniser l’export du lot Légendaire Aube"
          git push origin HEAD:refs/heads/feat/evolutions-legendaires-aube
