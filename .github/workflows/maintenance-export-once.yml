name: Regenerer les exports du contre-audit
on:
  push:
    branches: [refactor/css-vues-maintenance-20261022]
    paths: [.github/workflows/maintenance-export-once.yml]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm run build
          npm run build:cards
          rm .github/workflows/maintenance-export-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOUER.html ESSAI_CARTES.html .github/workflows/maintenance-export-once.yml
          git commit -m "build: regenerer les exports apres contre-audit"
          git push origin HEAD:${{ github.ref_name }}
