name: Préparer ponctuellement l’export des repères
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-camp-export.yml'
permissions:
  contents: read
jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/discreet-camp-markers-faction-summary-20261024'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discreet-camp-markers-faction-summary-20261024
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Générer depuis les sources et vérifier l’identité au build local
        run: |
          npm run build
          test "$(git hash-object JOUER.html)" = "f61db5e6089a2cab7cb552d43bf2542f4b703422"
      - name: Enregistrer uniquement l’export sur cette branche
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JOUER.html
          if ! git diff --cached --quiet; then
            git commit -m 'build: générer JOUER depuis les sources des repères validées'
            git push origin HEAD:fix/discreet-camp-markers-faction-summary-20261024
          fi
