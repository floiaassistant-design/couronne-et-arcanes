# Utilitaire transitoire : régénérer l'export depuis les sources de la branche, puis le supprimer.
name: Forge - régénération ponctuelle de JOUER
on:
  push:
    branches: [feat/forge-rares-epiques]
permissions:
  contents: write
jobs:
  standalone:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/forge-rares-epiques
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run build
      - name: Enregistrer uniquement l'export produit par le builder
        run: |
          if git diff --quiet -- JOUER.html; then
            echo "Export déjà conforme"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOUER.html
          git commit -m "build(forge): régénérer JOUER depuis les sources"
          git push origin HEAD:refs/heads/feat/forge-rares-epiques
