name: Préparer l'export de revue combat
on:
  push:
    branches: [feat/effets-combat-lisibles-20261023]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Générer l'export et retirer le préparateur de la branche
        run: |
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-combat-export.yml
          git add JOUER.html
          git commit -m "build: synchroniser l'export final des attaques lisibles"
          git push origin HEAD:feat/effets-combat-lisibles-20261023
