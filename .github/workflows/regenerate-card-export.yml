name: Regenerate reviewed card export
on:
  push:
    branches: [feat/ether-sorts-cartes-20261023]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate standalone from reviewed sources
        run: npm run build
      - name: Commit generated export on this feature branch
        run: |
          git add JOUER.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate standalone with 76 reviewed card exports"
          git push origin HEAD:refs/heads/feat/ether-sorts-cartes-20261023
