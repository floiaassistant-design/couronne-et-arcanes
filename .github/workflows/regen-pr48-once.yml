name: Rebuild temporaire JOUER PR 48
on:
  push:
    branches:
      - feat/collection-six-cartes-apercu-survol-20261024
    paths:
      - .github/workflows/regen-pr48-once.yml
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'floiaassistant-design/couronne-et-arcanes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/collection-six-cartes-apercu-survol-20261024
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerer seulement depuis les sources puis supprimer ce workflow
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          rm .github/workflows/regen-pr48-once.yml
          git add -- JOUER.html .github/workflows/regen-pr48-once.yml
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(collection): synchronize approved hover artwork in JOUER'
          git push origin HEAD:refs/heads/feat/collection-six-cartes-apercu-survol-20261024
