name: Préparer export Légendaires Ombre
on:
  push:
    branches: [feat/ombre-legendaires]
    paths: [.github/workflows/prepare-ombre-legend-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: npm run test:parity
      - run: echo '981a6388477b221de605c3e57f4a0c7a922aabaee77f247c8450c57f27b150e8  JOUER.html' | sha256sum -c -
      - run: npm run build:test
      - name: Enregistrer uniquement l’export généré sur cette branche
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feat/ombre-legendaires | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JOUER.html
          git diff --cached --name-only | diff - <(echo JOUER.html)
          git commit -m "build: générer l’export des Légendaires Ombre"
          git push origin HEAD:refs/heads/feat/ombre-legendaires
  parcours:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        scenario: [sylve, ombre]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run build:test
      - run: python3 -m pip install -r scripts/requirements-ci.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tests/browser_ombre.py
        if: matrix.scenario == 'ombre'
      - run: python3 tests/browser_sylve_legendary.py --scenario "${{ matrix.scenario }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: diagnostic-legend-${{ matrix.scenario }}
          path: |
            /tmp/ca-ombre-*.png
            /tmp/ca-sylve-legendary-*.png
          if-no-files-found: warn
          retention-days: 2
