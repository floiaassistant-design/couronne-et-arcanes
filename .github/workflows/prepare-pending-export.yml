name: Préparation ponctuelle du correctif de clôture

on:
  push:
    branches: [fix/resultats-combat-non-enregistres]
    paths: [.github/workflows/prepare-pending-export.yml]

permissions:
  contents: write

jobs:
  preparation:
    if: github.ref == 'refs/heads/fix/resultats-combat-non-enregistres'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Générer l'export et vérifier son empreinte locale approuvée
        run: |
          npm run build
          echo 'b3ce9b5b13048171c4d09a89e5f8678642b2dcfb232df1cc20913eba445e35ab  JOUER.html' | sha256sum -c -
          npm run build:test
      - name: Vérifier les sauvegardes et les nouveaux parcours de clôture
        run: |
          python3 -m pip install -r scripts/requirements-ci.txt
          python3 -m playwright install --with-deps chromium
          python3 tests/browser_save_integrity_v211.py
      - name: Enregistrer uniquement l'export généré sur cette branche
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code -- . ':!JOUER.html'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- JOUER.html
          git commit -m 'build: régénérer l’export du correctif de clôture'
          git push origin HEAD:refs/heads/fix/resultats-combat-non-enregistres
