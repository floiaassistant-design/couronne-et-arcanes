name: Préparer export des PR réunies
on:
  push:
    branches: [feat/laboratoire-developpeur-20261023]
jobs:
  preparer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:parity
      - run: npm run build
      - run: npm run build:test
      - name: Enregistrer uniquement l'export généré sur la branche de travail
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOUER.html
          if ! git diff --cached --quiet; then
            git commit -m "build: régénérer JOUER depuis Guide, effets et laboratoire"
            git push origin HEAD:refs/heads/feat/laboratoire-developpeur-20261023
          fi
      - name: Préparer la copie vérifiable pour contrôles locaux
        run: git archive --format=tar.gz -o /tmp/couronnes-sources.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: sources-integration
          path: /tmp/couronnes-sources.tar.gz
          retention-days: 3
