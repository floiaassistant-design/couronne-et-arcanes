name: Audit temporaire du stockage des archives CI

on:
  push:
    branches:
      - maintenance/audit-archives-ci-20261024
    paths:
      - .github/workflows/audit-archives-ci-temp.yml

permissions:
  contents: read
  actions: read

jobs:
  inventaire:
    runs-on: ubuntu-latest
    steps:
      - name: Inventaire des archives existantes sans rien supprimer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | "\(.id)|\(.name)|\(.size_in_bytes)|\(.created_at)|\(.expired)"' > /tmp/artifacts-ci.txt
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          lines = Path('/tmp/artifacts-ci.txt').read_text().splitlines()
          rows=[]
          for line in lines:
              p=line.split('|')
              if len(p)==5:
                  try: rows.append(dict(id=p[0],name=p[1],bytes=int(p[2]),created=p[3],expired=p[4]))
                  except ValueError: pass
          total=sum(x['bytes'] for x in rows)
          print('Nombre archives:',len(rows),'volume Mo:',round(total/1024/1024,1))
          print('Archives plus lourdes:')
          for x in sorted(rows,key=lambda a:a['bytes'],reverse=True)[:35]:
              print(f"{x['id']} | {x['bytes']/1024/1024:.1f} Mo | {x['created']} | expire={x['expired']} | {x['name']}")
          now=datetime.now(timezone.utc)
          for days in (1,3,7,14):
              old=[x for x in rows if datetime.fromisoformat(x['created'].replace('Z','+00:00')) < now-timedelta(days=days)]
              print(f"Age > {days} jours: {len(old)} archives, {sum(x['bytes'] for x in old)/1024/1024:.1f} Mo")
          PY
