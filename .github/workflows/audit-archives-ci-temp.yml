name: Audit temporaire du stockage des archives CI

on:
  push:
    branches:
      - maintenance/audit-archives-ci-20261024
    paths:
      - .github/workflows/audit-archives-ci-temp.yml

permissions:
  contents: read
  actions: write

jobs:
  inventaire:
    runs-on: ubuntu-latest
    steps:
      - name: Inventaire des archives existantes sans rien supprimer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | "\(.id)|\(.name)|\(.size_in_bytes)|\(.created_at)|\(.expired)"' > /tmp/artifacts-ci.txt
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          lines = Path('/tmp/artifacts-ci.txt').read_text().splitlines()
          rows=[]
          for line in lines:
              p=line.split('|')
              if len(p)==5:
                  try: rows.append(dict(id=p[0],name=p[1],bytes=int(p[2]),created=p[3],expired=p[4]))
                  except ValueError: pass
          total=sum(x['bytes'] for x in rows)
          print('Nombre archives:',len(rows),'volume Mo:',round(total/1024/1024,1))
          from collections import defaultdict
          groups=defaultdict(list)
          for x in rows: groups[x['name']].append(x)
          print('ARCHIVES PAR TYPE :')
          for name,entries in sorted(groups.items(),key=lambda pair:-sum(x['bytes'] for x in pair[1])):
              size=sum(x['bytes'] for x in entries)/1024/1024
              recent=max(entries,key=lambda a:a['created'])
              print(f"TYPE | {name} | count={len(entries)} | total={size:.1f} Mo | latest={recent['created']} | id={recent['id']} | latest_size={recent['bytes']/1024/1024:.1f} Mo")
          print('Archives plus lourdes:')
          for x in sorted(rows,key=lambda a:a['bytes'],reverse=True)[:35]:
              print(f"{x['id']} | {x['bytes']/1024/1024:.1f} Mo | {x['created']} | expire={x['expired']} | {x['name']}")
          now=datetime.now(timezone.utc)
          for days in (1,3,7,14):
              old=[x for x in rows if datetime.fromisoformat(x['created'].replace('Z','+00:00')) < now-timedelta(days=days)]
              print(f"Age > {days} jours: {len(old)} archives, {sum(x['bytes'] for x in old)/1024/1024:.1f} Mo")
          PY
      - name: Supprimer uniquement les archives dupliquées, garder deux références par type
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | "\(.id)|\(.name)|\(.size_in_bytes)|\(.created_at)|\(.expired)"' > /tmp/artifacts-ci-before.txt
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          groups=defaultdict(list)
          for line in Path('/tmp/artifacts-ci-before.txt').read_text().splitlines():
              p=line.split('|')
              if len(p)!=5: continue
              try: groups[p[1]].append(dict(id=p[0],name=p[1],bytes=int(p[2]),created=p[3],expired=p[4]))
              except ValueError: pass
          keep=[];delete=[]
          for name,entries in groups.items():
              ordered=sorted(entries,key=lambda a:(a['created'],int(a['id'])),reverse=True)
              preserved=ordered if name=='sources-integration' else ordered[:2]
              keep.extend(preserved)
              delete.extend(x for x in ordered if x not in preserved)
          print('AUDIT-SUPPRESSION: nombre conservés',len(keep), 'nombre supprimables',len(delete),flush=True)
          print('AUDIT-SUPPRESSION: volume à libérer (Mo)',round(sum(x['bytes'] for x in delete)/1024/1024,1),flush=True)
          print('AUDIT-SUPPRESSION: volume restant théorique (Mo)',round(sum(x['bytes'] for x in keep)/1024/1024,1),flush=True)
          print('Archives conservées:',flush=True)
          for a in keep: print(f"conservé | {a['id']} | {a['name']} | {a['bytes']/1024/1024:.1f} Mo | {a['created']}",flush=True)
          Path('/tmp/artifacts-ci-delete.txt').write_text('\n'.join(x['id'] for x in delete)+'\n')
          PY
          count=0
          while IFS= read -r artifact; do
            if [[ -z "$artifact" ]]; then continue; fi
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" --silent
            count=$((count+1))
            if (( count % 25 == 0 )); then echo "Suppression confirmée : $count archives"; fi
          done < /tmp/artifacts-ci-delete.txt
          echo "Suppressions API terminées: $count"
          gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | "\(.name)|\(.size_in_bytes)"' > /tmp/artifacts-ci-after.txt
          python3 - <<'PY'
          from pathlib import Path
          rows=[]
          for line in Path('/tmp/artifacts-ci-after.txt').read_text().splitlines():
              p=line.split('|')
              if len(p)==2:
                  try: rows.append((p[0],int(p[1])))
                  except ValueError: pass
          print("RESTE",len(rows),"archives,",round(sum(s for _,s in rows)/1024/1024,1),"Mo")
          PY
