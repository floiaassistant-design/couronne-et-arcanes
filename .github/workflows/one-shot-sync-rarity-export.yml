name: Regenerer une fois JOUER pour les contours de rarete
on:
  push:
    branches:
      - fix/contours-rarete-visibles-20261107
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/contours-rarete-visibles-20261107
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generer JOUER et retirer ce workflow temporaire
        run: |
          npm run build
          git rm -- .github/workflows/one-shot-sync-rarity-export.yml
          git add -- JOUER.html
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerer JOUER depuis les sources des contours"
          git push origin HEAD:refs/heads/fix/contours-rarete-visibles-20261107
