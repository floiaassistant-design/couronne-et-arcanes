name: Préparer export dernières Divines Éther
on:
  push:
    branches: [feat/ether-dernieres-divines-20261106]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Vérifier le paquet généré
        run: |
          npm run build
          npm run build:test
          node scripts/build_web.mjs
          cmp JOUER.html dist/JOUER.html
          test "$(git hash-object JOUER.html)" = 7939586e7f2b3c989d5dc2ddba01bf2f7fd49881
          sha256sum JOUER.html
      - name: Enregistrer uniquement le blob vérifié
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const content=readFileSync('JOUER.html').toString('base64');
          const response=await fetch('https://api.github.com/repos/floiaassistant-design/couronne-et-arcanes/git/blobs',{
            method:'POST',
            headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
            body:JSON.stringify({content,encoding:'base64'})
          });
          if(!response.ok)throw Error('Blob HTTP '+response.status);
          const {sha}=await response.json();
          if(sha!=='7939586e7f2b3c989d5dc2ddba01bf2f7fd49881')throw Error('Empreinte GitHub différente');
          console.log('GENERATED_BLOB='+sha);
          NODE
