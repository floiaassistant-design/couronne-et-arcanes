name: Temporaire - reconstruire JOUER pour la PR laboratoire
on:
  push:
    branches: [feat/laboratoire-developpeur-20261023]
jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier le moteur et la parité avant construction
        run: |
          npm test
          npm run test:parity
      - name: Régénérer l'unique export depuis les sources
        run: |
          npm run build
          npm run build:test
      - name: Publier le HTML régénéré uniquement sur la branche de travail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOUER.html
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate JOUER.html for laboratory PR"
            git push origin HEAD:feat/laboratoire-developpeur-20261023
          fi