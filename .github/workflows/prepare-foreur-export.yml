name: Préparation ponctuelle de l'export Foreur
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  export-foreur:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/forge-foreur-legendaire-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Enregistrer le blob généré sans modifier de branche
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BLOB: 8e2e44aab953d1660774c162477f8a42f3a686a3
        run: |
          npm run build
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const bytes=readFileSync('JOUER.html');
          const sha=createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');
          if(sha!==process.env.EXPECTED_BLOB)throw Error('Export différent du build local vérifié : '+sha);
          const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/git/blobs',{
            method:'POST',
            headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},
            body:JSON.stringify({encoding:'base64',content:bytes.toString('base64')})
          });
          if(!response.ok)throw Error('Enregistrement refusé : HTTP '+response.status);
          const blob=await response.json();
          if(blob.sha!==sha)throw Error('Empreinte distante différente');
          console.log('GENERATED_BLOB='+blob.sha);
          NODE
