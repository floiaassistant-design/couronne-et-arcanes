name: Préparer export Éther Divin vérifié
on:
  push:
    branches: [feat/ether-premiers-divins-20261105]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run build
      - name: Enregistrer uniquement l’export vérifié
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const content=fs.readFileSync('JOUER.html');
          const sha=crypto.createHash('sha1').update(Buffer.from('blob '+content.length+'\0')).update(content).digest('hex');
          if(sha!=='1e15897f6e26a7c3ae8d8c2c324c8fe5b2946b3b')throw Error('Export différent du local vérifié');
          for(let attempt=0;attempt<3;attempt++){
            const response=await fetch('https://api.github.com/repos/floiaassistant-design/couronne-et-arcanes/git/blobs',{
              method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
              body:JSON.stringify({content:content.toString('base64'),encoding:'base64'})
            });
            if(!response.ok){if(response.status>=500&&attempt<2)continue;throw Error('Blob HTTP '+response.status);}
            const result=await response.json();if(result.sha!==sha)throw Error('Empreinte GitHub différente');
            console.log('GENERATED_BLOB='+result.sha);break;
          }
          NODE
