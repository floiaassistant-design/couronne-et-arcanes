name: Assemblage web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assemblage-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Préparer les fichiers du site depuis le jeu existant
        run: node scripts/build_web.mjs
      - name: Enregistrer la provenance exacte du paquet
        run: node scripts/package_web_artifact.mjs "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
      - name: Conserver le paquet pour la publication Sites
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: couronnes-web
          path: /tmp/couronnes-web.tar.gz
          retention-days: 14
