name: Générer JOUER.html pour la PR Collection 48 (temporaire)

on:
  push:
    branches:
      - feat/collection-six-cartes-apercu-survol-20261024
    paths:
      - .github/workflows/regenerer-jouer-pr48-temporaire.yml

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Régénérer l'unique export depuis les sources
        run: npm run build
      - name: Enregistrer seulement JOUER.html
        run: |
          git add JOUER.html
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: régénérer JOUER.html depuis les sources Collection"
            git push origin HEAD:feat/collection-six-cartes-apercu-survol-20261024
          fi
