name: Préparer export Ombre Divine Éveillée
on:
  push:
    branches: [feat/ombre-divines-eveillees]
    paths: [.github/workflows/prepare-ombre-hauts-rangs.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: npm run test:parity
      - run: echo '712c48935bdc05697dab2d207720cbcd0a1572a8e3d56a194973d3cad4e3ad33  JOUER.html' | sha256sum -c -
      - run: npm run build:test
      - name: Enregistrer uniquement l’export généré sur cette branche
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feat/ombre-divines-eveillees | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JOUER.html
          git diff --cached --name-only | diff - <(echo JOUER.html)
          git commit -m "build: générer l’export Ombre Divine Éveillée"
          git push origin HEAD:refs/heads/feat/ombre-divines-eveillees
  parcours:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [desktop, portrait, landscape, web-recovery]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run build:test
      - run: python3 -m pip install -r scripts/requirements-ci.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tests/browser_ombre.py
        if: matrix.part == 'desktop'
      - run: python3 tests/browser_evolution_trials.py --part "${{ matrix.part }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: diagnostic-ombre-hauts-${{ matrix.part }}
          path: /tmp/ca-*.png
          if-no-files-found: warn
          retention-days: 2
