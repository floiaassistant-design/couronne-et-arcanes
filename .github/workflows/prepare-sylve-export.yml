name: Préparer export Sylve
on:
  push:
    branches: [feat/ascensions-sylve]
    paths: [.github/workflows/prepare-sylve-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:parity
      - run: npm run build
      - run: echo 'd5871600163c8eea49baa4bf95471be4b9a1c82132376deee86585c9ebd6d418  JOUER.html' | sha256sum -c -
      - run: npm run build:test
      - name: Enregistrer uniquement l’export généré sur cette branche
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/feat/ascensions-sylve | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JOUER.html
          git diff --cached --name-only | diff - <(echo JOUER.html)
          git commit -m "build: générer l’export des ascensions Sylve"
          git push origin HEAD:refs/heads/feat/ascensions-sylve
  parcours:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [desktop, portrait, landscape, web-recovery]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run build:test
      - run: python3 -m pip install -r scripts/requirements-ci.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tests/browser_evolution_trials.py --part "${{ matrix.part }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sylve-${{ matrix.part }}
          path: /tmp/ca-evolution-ascension-*.png
          if-no-files-found: warn
          retention-days: 2
