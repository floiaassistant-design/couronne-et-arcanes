name: Préparer ponctuellement l’export Concorde
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-concorde-export.yml'
permissions:
  contents: read
jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/concorde-emblemes-20261024'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/concorde-emblemes-20261024
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Générer depuis les sources et vérifier l’identité au build local
        run: |
          npm run build
          test "$(git hash-object JOUER.html)" = "1e2efb67929e1c0d50c93914c288ef60ce957056"
      - name: Enregistrer uniquement l’export sur cette branche
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JOUER.html
          if ! git diff --cached --quiet; then
            git commit -m 'build: générer JOUER depuis les sources Concorde vérifiées'
            git push origin HEAD:feat/concorde-emblemes-20261024
          fi
