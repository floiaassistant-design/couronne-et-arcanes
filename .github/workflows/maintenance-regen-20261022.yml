name: Maintenance temporaire - regenerer les exports
on:
  push:
    branches:
      - chore/audit-imports-interface-20261022
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Générer depuis les sources
        run: |
          npm run build
          npm run build:cards
      - name: Enregistrer les deux exports sur cette branche uniquement
        run: |
          git add -- JOUER.html ESSAI_CARTES.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: regenerer les exports autonomes depuis les sources'
          git push origin HEAD:chore/audit-imports-interface-20261022
