name: Synchronisation ponctuelle de JOUER.html pour la PR 65
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  export:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/fiabiliser-sauvegardes-20261030' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Générer JOUER.html depuis les sources et retirer ce workflow
        run: |
          npm run build
          git add JOUER.html
          git rm -- .github/workflows/regen-export-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: synchroniser export autonome après correction de syntaxe'
          git push origin HEAD:refs/heads/fix/fiabiliser-sauvegardes-20261030
