name: Préparation ponctuelle export Forge tactique
on:
  push:
    branches: [feat/forge-hauts-rangs-tactiques-20261103]
permissions:
  contents: read
jobs:
  export-blob:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run build
      - name: Enregistrer uniquement le blob généré
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BLOB: 9ed63f64020ecf69d8dedd3424953dcffb256c08
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const data=readFileSync('JOUER.html');
          const sha=createHash('sha1').update(Buffer.from('blob '+data.length+'\0')).update(data).digest('hex');
          if(sha!==process.env.EXPECTED_BLOB)throw Error('Export inattendu '+sha);
          const r=await fetch('https://api.github.com/repos/floiaassistant-design/couronne-et-arcanes/git/blobs',{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({content:data.toString('base64'),encoding:'base64'})});
          if(!r.ok)throw Error('Écriture du blob refusée '+r.status);
          const out=await r.json();if(out.sha!==sha)throw Error('Blob différent');
          console.log('GENERATED_BLOB='+out.sha);
          NODE
