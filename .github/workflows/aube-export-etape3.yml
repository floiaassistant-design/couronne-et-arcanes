name: Générer l’export Aube étape 3 partielle
on:
  push:
    branches: [feat/aube-evolutions-fiche-universelle]
permissions:
  contents: write
jobs:
  export:
    if: github.repository == 'floiaassistant-design/couronne-et-arcanes' && github.ref == 'refs/heads/feat/aube-evolutions-fiche-universelle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Générer et enregistrer uniquement l’export sur la branche de travail
        run: |
          npm run build
          test "$(git hash-object JOUER.html)" = "94970b6697e05d0fb36677c3495d2b4e4147c9f7"
          git fetch origin feat/aube-evolutions-fiche-universelle
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          if git diff --quiet -- JOUER.html; then exit 0; fi
          test "$(git diff --name-only)" = "JOUER.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOUER.html
          git commit -m "build: générer JOUER depuis les défenses Aube"
          git push origin HEAD:refs/heads/feat/aube-evolutions-fiche-universelle
