name: Génération ponctuelle JOUER pour la PR 44

on:
  push:
    branches:
      - fix/minimum-card-delay-one-20261024

permissions:
  contents: write

jobs:
  generate-jouer:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer la branche à reconstruire
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Régénérer l'unique export depuis les sources
        run: npm run build
      - name: Publier uniquement l'export généré sur cette branche, sans fusion
        run: |
          test "$(git diff --name-only)" = "JOUER.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- JOUER.html
          git commit -m "build: synchroniser JOUER avec le délai minimal 1"
          git push origin HEAD:refs/heads/fix/minimum-card-delay-one-20261024
