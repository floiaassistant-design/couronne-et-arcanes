name: Générer JOUER ciblage (temporaire)
on:
  push:
    branches: [feat/ciblage-effets-combat-20261023]
    paths: [.github/workflows/rebuild-ciblage.yml]
jobs:
  export:
    if: github.ref == 'refs/heads/feat/ciblage-effets-combat-20261023'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ciblage-effets-combat-20261023
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Enregistrer uniquement l’export généré sur cette branche
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JOUER.html
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate official JOUER from targeting sources'
            git push origin HEAD:feat/ciblage-effets-combat-20261023
          fi
