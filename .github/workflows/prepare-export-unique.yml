name: Préparer l'export unique
on:
  push:
    branches: [refactor/export-unique-cartes-20261022]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Générer le HTML puis retirer ce préparateur temporaire
        run: |
          npm run build
          test -s JOUER.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-export-unique.yml
          git add JOUER.html
          git commit -m "build: générer l'export unique depuis les sources et retirer le préparateur"
          git push origin HEAD:refs/heads/refactor/export-unique-cartes-20261022
