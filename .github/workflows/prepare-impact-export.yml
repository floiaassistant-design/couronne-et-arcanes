name: Préparer l'export de la PR Impact (temporaire)
on:
  push:
    branches:
      - fix/impact-cibles-adjacentes-20261102
permissions:
  contents: write
jobs:
  artefacts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Régénérer par les scripts officiels, sans modifier l'archive historique
        run: |
          npm run build
          rm tests/fixtures/rules_baseline_cards_v2.json
          node scripts/parity_snapshot.mjs --record-current
          npm run test:parity
          npm test
          npm run build:test
      - name: Déposer l'export et le snapshot de référence du nouveau contrat sur cette branche seulement
        run: |
          git add -- JOUER.html tests/fixtures/rules_baseline_cards_v2.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: régénérer export et empreintes après ciblage Impact'
            git push origin HEAD:fix/impact-cibles-adjacentes-20261102
          fi
