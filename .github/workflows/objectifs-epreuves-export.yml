name: Générer l’export des objectifs d’épreuves
on:
  push:
    branches: [feat/objectifs-epreuves-aube]
    paths: [.github/workflows/objectifs-epreuves-export.yml]
permissions:
  contents: write
jobs:
  export:
    if: github.repository == 'floiaassistant-design/couronne-et-arcanes' && github.ref == 'refs/heads/feat/objectifs-epreuves-aube'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Générer uniquement l’export vérifié sur cette branche
        run: |
          npm run build
          test "$(git hash-object JOUER.html)" = "6fbe2f7eb8c085459a5e5c421d97faf327054029"
          git fetch origin feat/objectifs-epreuves-aube
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          if git diff --quiet -- JOUER.html; then exit 0; fi
          test "$(git diff --name-only)" = "JOUER.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JOUER.html
          git commit -m "build: synchroniser l’export des objectifs d’épreuves"
          git push origin HEAD:refs/heads/feat/objectifs-epreuves-aube
