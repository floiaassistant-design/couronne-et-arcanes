name: Reconstruction temporaire HTML
on:
  push:
    branches: [refactor/guide-module-documentation-20261023]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/refactor/guide-module-documentation-20261023'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Publier l'export généré sur cette seule branche
        run: |
          if ! git diff --quiet -- JOUER.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add JOUER.html
            git commit -m "build: regenerate JOUER.html"
            git push origin HEAD:refs/heads/refactor/guide-module-documentation-20261023
          fi
