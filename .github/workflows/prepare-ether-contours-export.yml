name: Préparer assemblage Éther et contours
on:
  push:
    branches: [feat/ether-premiers-divins-20261105]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Générer et vérifier les distributions communes
        run: |
          npm run build
          npm run build:test
          node scripts/build_web.mjs
          git diff --check
          python3 -m py_compile tests/browser_sylve_legendary.py
      - name: Vérifier moteur et parité sur cet assemblage
        run: |
          npm test
          npm run test:parity
      - name: Enregistrer uniquement le JOUER généré
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const content=fs.readFileSync('JOUER.html'),css=fs.readFileSync('assets/generated-card.css','utf8');
          if(content.length!==34629285)throw Error('Taille inattendue pour l’assemblage des deux lots');
          if(!css.includes('outline:2px solid var(--rarity-border')||!content.toString('utf8').includes(css))throw Error('Contour commun absent de l’export');
          const sha=crypto.createHash('sha1').update(Buffer.from('blob '+content.length+'\0')).update(content).digest('hex');
          const digest=crypto.createHash('sha256').update(content).digest('hex');
          for(let attempt=0;attempt<3;attempt++){
            const response=await fetch('https://api.github.com/repos/floiaassistant-design/couronne-et-arcanes/git/blobs',{
              method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
              body:JSON.stringify({content:content.toString('base64'),encoding:'base64'})
            });
            if(!response.ok){if(response.status>=500&&attempt<2)continue;throw Error('Blob HTTP '+response.status);}
            const result=await response.json();if(result.sha!==sha)throw Error('Empreinte GitHub différente');
            console.log('BUILT_COMMIT='+process.env.BUILT_COMMIT);
            console.log('GENERATED_BLOB='+result.sha);
            console.log('GENERATED_SHA256='+digest);
            console.log('GENERATED_BYTES='+content.length);break;
          }
          NODE
