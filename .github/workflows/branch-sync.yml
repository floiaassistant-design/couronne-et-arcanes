name: Synchronisation temporaire des exports de la branche
on:
  push:
    branches:
      - feat/tours-alternes-ia-visible-20261021
permissions:
  contents: write
jobs:
  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruire les exports
        run: |
          npm run build
          npm run build:cards
      - name: Enregistrer les exports
        run: |
          if ! git diff --quiet -- JOUER.html ESSAI_CARTES.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add JOUER.html ESSAI_CARTES.html
            git commit -m "build: mettre à jour les exports après les correctifs"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
