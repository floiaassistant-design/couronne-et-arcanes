name: Tests Couronnes et Arcanes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests du moteur et des compositions
        run: npm test
      - name: Parité déterministe du combat
        run: npm run test:parity
      - name: Construire le jeu hors ligne
        run: npm run build
      - name: Vérifier la synchronisation du HTML autonome
        run: git diff --exit-code -- JOUER.html
      - name: Installer Playwright et Chromium
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Construire le HTML réservé aux tests navigateur
        run: npm run build:test
      - name: Parcours V2.8 ordinateur et téléphone simulé
        run: python3 tests/browser_class_skills_v28.py
      - name: Nouvelle partie, raretés et reprise sur ordinateur et mobile
        run: python3 tests/browser_new_game_legibility_v211.py
      - name: Parcours V2.9 et export autonome ordinateur et téléphone simulé
        run: python3 tests/browser_battle_control_v29.py
      - name: 'Pilote Illustrée : fiche, délai réel, pose et mobile'
        run: python3 tests/browser_illustrated_pilot_v3.py
      - name: Statistiques effectives, capacités et combat réel bureau/mobile
        run: python3 tests/browser_card_capabilities.py
      - name: Cinq portraits Aube, unités préservées et export hors réseau
        run: python3 tests/browser_portraits_aube.py
      - name: Simulations de contrôle reproductibles
        run: npm run control-balance
      - name: Arène 2/3/4 lignes, mobile et reprise historique
        run: python3 tests/browser_arena_v211.py
      - name: Combat immersif, main fixe en bas, bureau et mobile
        run: python3 tests/browser_combat_fullscreen_v211.py
      - name: Arène peinte fixe, ancrages et statistiques des cartes
        run: python3 tests/browser_painted_arena.py
      - name: Captures des arènes et version jouable pour revue
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: apercu-arene-structuree
          path: |
            /tmp/ca-arena-*.png
            /tmp/ca-combat-*.png
            /tmp/ca-capacites-*.png
            /tmp/ca-aube-*.png
            JOUER.html
          if-no-files-found: warn
          retention-days: 14
      - name: Clôture du combat, stockage et reprise après coupure
        run: python3 tests/browser_save_integrity_v211.py
      - name: Comparaison de géométrie et reproductibilité
        run: npm run arena-balance
