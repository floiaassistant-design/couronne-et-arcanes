name: Tests Couronnes et Arcanes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests du moteur et des compositions
        run: npm test
      - name: Parité déterministe du combat
        run: npm run test:parity
      - name: Construire le jeu hors ligne
        run: npm run build
