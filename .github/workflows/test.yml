name: Tests Couronnes et Arcanes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  card-study:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:cards
      - run: node scripts/build_standalone.mjs --cards --test
      - run: git diff --exit-code -- ESSAI_CARTES.html
      - name: Installer Chromium pour l’essai
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Essai cartes bureau, mobile et hors ligne
        run: python3 tests/browser_card_study.py
      - name: Déploiement sur trois cases et sélection sans fiche
        run: python3 tests/browser_deployment.py
      - name: Aperçus partagés, survol, clavier et toucher
        run: python3 tests/browser_card_preview.py
      - name: Base neuve, images neutres et absence d’anciens effets
        run: python3 tests/browser_art_reset.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essai-cartes
          path: |
            ESSAI_CARTES.html
            /tmp/ca-card-study-*.png
            /tmp/ca-card-preview-*.png
            /tmp/ca-deployment-*.png
          retention-days: 14
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests du moteur et des compositions
        run: npm test
      - name: Parité déterministe du combat
        run: npm run test:parity
      - name: Construire le jeu hors ligne
        run: npm run build
      - name: Vérifier la synchronisation du HTML autonome
        run: git diff --exit-code -- JOUER.html
      - name: Installer Playwright et Chromium
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Construire le HTML réservé aux tests navigateur
        run: npm run build:test
      - name: Collection pleine largeur, exemplaires réels et reprise
        run: python3 tests/browser_collection.py
      - name: Milicien v02, champs dynamiques, pose et reprise hors réseau
        run: python3 tests/browser_milicien.py
      - name: Dix cartes Aube et sceaux des deux camps, bureau et mobile hors réseau
        run: python3 tests/browser_aube.py
      - name: Onze cartes Sylve, valeurs réelles et reprise bureau/mobile hors réseau
        run: python3 tests/browser_sylve.py
      - name: Parcours V2.8 ordinateur et téléphone simulé
        run: python3 tests/browser_class_skills_v28.py
      - name: Nouvelle partie, raretés et reprise sur ordinateur et mobile
        run: python3 tests/browser_new_game_legibility_v211.py
      - name: Parcours V2.9 et export autonome ordinateur et téléphone simulé
        run: python3 tests/browser_battle_control_v29.py
      - name: 'Pilote Illustrée : fiche, délai réel, pose et mobile'
        run: python3 tests/browser_illustrated_pilot_v3.py
      - name: Statistiques effectives, capacités et combat réel bureau/mobile
        run: python3 tests/browser_card_capabilities.py
      - name: Simulations de contrôle reproductibles
        run: npm run control-balance
      - name: Arène 2/3/4 lignes, mobile et reprise historique
        run: python3 tests/browser_arena_v211.py
      - name: Combat immersif, main fixe en bas, bureau et mobile
        run: python3 tests/browser_combat_fullscreen_v211.py
      - name: Arène peinte fixe, ancrages et statistiques des cartes
        run: python3 tests/browser_painted_arena.py
      - name: Captures des arènes et version jouable pour revue
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: apercu-arene-structuree
          path: |
            /tmp/ca-arena-*.png
            /tmp/ca-combat-*.png
            /tmp/ca-capacites-*.png
            /tmp/ca-collection-*.png
            /tmp/ca-milicien-*.png
            /tmp/ca-aube-*.png
            /tmp/ca-sylve-*.png
            JOUER.html
          if-no-files-found: warn
          retention-days: 14
      - name: Clôture du combat, stockage et reprise après coupure
        run: python3 tests/browser_save_integrity_v211.py
      - name: Comparaison de géométrie et reproductibilité
        run: npm run arena-balance
