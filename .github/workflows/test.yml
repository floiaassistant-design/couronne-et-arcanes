name: Tests Couronnes et Arcanes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Une nouvelle révision de PR remplace l'ancienne ; chaque push main reste indépendant.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [interface, combat, catalogue, moteur]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Déterminer la portée de validation de la PR
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci_change_scope.mjs
      - name: Contrôler les PR documentaires
        if: matrix.group == 'moteur' && steps.scope.outputs.docs_only == 'true'
        run: node --test tests/ci_change_scope.test.mjs tests/ci_pipeline.test.mjs
      - name: Tests du moteur et des compositions
        if: matrix.group == 'moteur' && steps.scope.outputs.docs_only != 'true'
        run: npm test
      - name: Parité déterministe du combat
        if: matrix.group == 'moteur' && steps.scope.outputs.docs_only != 'true'
        run: npm run test:parity
      - name: Construire et vérifier le jeu hors ligne
        if: matrix.group == 'moteur' && steps.scope.outputs.docs_only != 'true'
        run: |
          npm run build
          git diff --exit-code -- JOUER.html
      - name: Simulations de contrôle reproductibles
        if: matrix.group == 'moteur' && steps.scope.outputs.docs_only != 'true'
        run: npm run control-balance
      - name: Comparaison de géométrie et reproductibilité
        if: matrix.group == 'moteur' && steps.scope.outputs.docs_only != 'true'
        run: npm run arena-balance
      - name: Retrouver Chromium en cache
        if: steps.scope.outputs.docs_only != 'true'
        id: chromium
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/requirements-ci.txt') }}
      - name: Installer Playwright et les dépendances de Chromium
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python3 -m pip install -r scripts/requirements-ci.txt
          python3 -m playwright install --with-deps chromium
      - name: Garder Chromium pour les prochains passages
        if: matrix.group == 'moteur' && steps.scope.outputs.docs_only != 'true' && steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium.outputs.cache-primary-key }}
      - name: Construire le diagnostic local du groupe
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run build:test
      - name: Parcours navigateur du groupe
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/run_browser_group.py "${{ matrix.group }}"
      - name: Conserver les captures si échec ou revue demandée
        if: always() && github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true' && (failure() || contains(github.event.pull_request.labels.*.name, 'captures-ci'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apercu-${{ matrix.group }}
          path: |
            /tmp/ca-maintenance-*.png
            /tmp/ca-arena-*.png
            /tmp/ca-combat-*.png
            /tmp/ca-combat-fx-*.png
            /tmp/ca-targeting-*.png
            /tmp/ca-concorde-*.png
            /tmp/ca-capacites-*.png
            /tmp/ca-collection-*.png
            /tmp/ca-milicien-*.png
            /tmp/ca-aube-*.png
            /tmp/ca-sylve-*.png
            /tmp/ca-ombre-*.png
            /tmp/ca-forge-*.png
            /tmp/ca-ether-*.png
            /tmp/ca-spells-*.png
            /tmp/ca-card-study-*.png
            /tmp/ca-card-preview-*.png
            /tmp/ca-deployment-*.png
            /tmp/ca-evolution-*.png
            /tmp/ca-manual-deck-*.png
          if-no-files-found: warn
          retention-days: 2

  # Conserver le nom historique à rendre obligatoire dans la protection de main.
  validation:
    name: validation
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Récupérer le verdict
        env:
          TEST_GROUPS_RESULT: ${{ needs.tests.result }}
        run: |
          if [ "$TEST_GROUPS_RESULT" != "success" ]; then
            echo "Validation refusée : groupes = $TEST_GROUPS_RESULT"
            exit 1
          fi
          echo "Tous les groupes de validation ont réussi."
