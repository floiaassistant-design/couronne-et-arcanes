# Génération ponctuelle du fichier autonome sur la branche du pilote Difficile.
name: Générer JOUER pour la campagne Difficile
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  regenerer:
    if: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/campagne-difficile-pilote' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Générer et vérifier l’export
        run: |
          npm run build
          printf '%s  JOUER.html\n' 'b9b13649a4308fd2718903c9bbe6d11f6cb68ef43ef32f11d49ab684025cb91d' | sha256sum --check
          git diff --exit-code -- . ':!JOUER.html'
      - name: Pousser l’export sur la branche
        run: |
          git add -- JOUER.html
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: régénérer JOUER avec le pilote Difficile'
          git push origin HEAD:refs/heads/feat/campagne-difficile-pilote
