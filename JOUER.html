"src/ai.js":function(__exports,__load){
// IA tactique V1.7 — heuristique déterministe, sans accès aux cartes cachées du joueur.
// Évalue l'état public du plateau et les cartes réellement présentes dans sa propre main.
const {CARDS,GUARD_IDS,CHARGE_IDS}=__load("src/data.js");
const {silenceTarget,silenceValue,teleportPlan,teleportGain,trapPlan,activeAbility}=__load("src/engine/battle-control.js");
const {accelerationTarget}=__load("src/engine/tempo.js");
const AI_STYLES = Object.freeze({
 equilibre:{name:'Équilibré',desc:'Combine attaque, défense et opportunités de cartes.'},
 assaut:{name:'Assaut',desc:'Favorise les unités offensives et les percées rapides.'},
 bastion:{name:'Bastion',desc:'Protège sa couronne avec gardiens, soins et boucliers.'},
 rituel:{name:'Rituel',desc:'Privilégie les sorts utiles et les attaques à distance.'},
 meute:{name:'Meute',desc:'Regroupe les créatures d’un même ordre pour former des lignes puissantes.'}
});
const aiStyle = b => AI_STYLES[b?.aiStyle] ? b.aiStyle : 'equilibre';
const aiEnraged = b => Boolean(b?.aiBoss && b?.heroes?.e && b.heroes.e.hp>0 && b.heroes.e.hp*2<=b.heroes.e.maxhp);
const {laneCount,lastCell,crownColumn,entryColumn,freeDeploymentColumn}=__load("src/engine/board.js");
const finite=(n)=>Number.isFinite(n)?n:0;
const alive=(u)=>!!u && u.hp>0;

function inspectEnemyLane(b,lane){
 const row=b.board[lane]||[];
 const threats=[],friends=[];
 for(let col=1;col<=lastCell(b);col++){
  const u=row[col];if(!alive(u))continue;
  if(u.side==='p')threats.push({u,col});
  else if(u.side==='e')friends.push({u,col});
 }
 // Plus un ennemi est proche de la couronne ennemie (droite), plus il faut l'arrêter.
 const urgency=threats.reduce((sum,{u,col})=>{
  const steps=Math.max(1,crownColumn(b,'e')-col);
  return sum+(steps<=2?7:steps===3?3:0)+Math.max(1,u.atk)*(steps===1?3:steps===2?1.65:steps===3?.6:.15)
   +(CHARGE_IDS.has(u.id)&&steps<=3?2:0)+(u.ranged&&steps<=3?2:0)+1/steps;
 },0);
 const frontline=threats.sort((a,z)=>z.col-a.col)[0]||null;
 const guard=friends.some(({u})=>GUARD_IDS.has(u.id));
 return {lane,threats,friends,frontline,urgency,guard,entryFree:!alive(row[entryColumn(b,'e')]),deploymentCol:freeDeploymentColumn(b,'e',lane)};
}

// Estimation limitée au plateau public : une unité interposée ou un gardien
// empêche de compter un coup direct sur la couronne au prochain combat.
function crownRisk(b,laneInfo){
 if(laneInfo.guard)return 0;
 return laneInfo.threats.reduce((sum,{u,col})=>{
  const steps=crownColumn(b,'e')-col;
  if((u.stun||0)>0||!(steps<=2||(steps===3&&u.ability==='haste')))return sum;
  const range=u.ranged?2:1;
  if(laneInfo.friends.some(x=>x.col>col&&x.col-col<=range))return sum;
  return sum+Math.max(1,u.atk)+(CHARGE_IDS.has(u.id)&&col<lastCell(b)?2:0);
 },0);
}

function scoreOption(b,card,laneInfo,context){
 const {urgency,threats,friends,frontline,guard}=laneInfo;
 const hero=b.heroes.e,enemyHero=b.heroes.p;
 if(card.type==='unité'){
  if(laneInfo.deploymentCol===undefined)return null;
  const synergy=friends.filter(({u})=>CARDS[u.id]?.faction===card.faction).length;
  let score=4.4+card.attack*.65+card.hp*.17;
  score+=Math.min(22,urgency)*.75;
  // L'unité invoquée sur la case d'entrée 5 fait écran face à une attaque proche.
  if(context.risks[laneInfo.lane]>0&&threats.some(x=>x.col===entryColumn(b,'e')-1))
   score+=Math.min(14,5+context.risks[laneInfo.lane]*1.7);
  score+=synergy?5.2+Math.min(2,synergy)*1.3:0;
  score+=threats.length&&card.ability==='ranged'?3.1:0;
  score+=threats.length&&card.ability==='pierce'&&threats.some(({u})=>(u.armor||0)>0)?4:0;
  score+=urgency>=12&&GUARD_IDS.has(card.id)?5.5:0;
  score+=urgency>=8&&card.hp>=8?2:0;
  score+=friends.length===0&&threats.length===0?2.4:0;
  score-=friends.length>=3?2:0;
  if(card.ability==='silence'&&silenceTarget(b,'e',laneInfo.lane))score+=5;
  if(card.ability==='trapper'&&threats.length&&trapPlan(b,'e',laneInfo.lane,entryColumn(b,'e')-1))score+=3;
  // Les pièges visibles près de l'entrée pénalisent les unités fragiles.
  if((b.traps||[]).some(t=>t.owner==='p'&&t.lane===laneInfo.lane&&t.col===entryColumn(b,'e')-1&&t.expiresRound>=b.round))score-=card.hp<=3?5:2;
  const reason=urgency>=12?'Défense prioritaire':synergy?'Formation de faction':threats.length?'Contre-attaque':'Percée stratégique';
  return {score,reason};
 }
 if(card.type!=='sort')return null;
 let score=-Infinity,reason='Sort tactique';
 const ability=card.ability;
 const hpLoss=Math.max(0,hero.maxhp-hero.hp);
 const injured=friends.reduce((n,{u})=>n+Math.max(0,u.maxhp-u.hp),0);
 if(ability==='spell_bolt'){
  if(frontline){score=5+Math.min(4,frontline.u.hp)*1.2+Math.min(25,urgency)*.72+(frontline.u.hp<=Math.max(1,4-(frontline.u.armor||0))?5:0);if(context.risks[laneInfo.lane]>0&&frontline.u.hp<=Math.max(1,4-(frontline.u.armor||0)))
    score+=Math.min(20,6+context.risks[laneInfo.lane]*2);
   reason='Éliminer une menace';}
  else if(enemyHero.hp<=2){score=100;reason='Achever la couronne';}
 }else if(ability==='spell_storm'){
  if(threats.length){const damage=threats.reduce((n,{u})=>n+Math.min(u.hp,Math.max(1,3-(u.armor||0))),0);
   score=2+damage*1.25+threats.length*2.5+Math.min(22,urgency)*.45;
   if(context.risks[laneInfo.lane]>0)
    score+=Math.min(18,context.risks[laneInfo.lane]*2)*(threats.some(x=>x.u.hp<=3)?1:.3);
   reason='Dissiper l’assaut';}
 }else if(ability==='spell_root'){
  if(frontline&&frontline.u.stun<=0){score=3+Math.min(25,urgency)*.55+(frontline.col>=lastCell(b)-1?5:0);
   if(context.risks[laneInfo.lane]>0&&frontline.col>=lastCell(b)-1)
    score+=Math.min(14,4+context.risks[laneInfo.lane]*1.8);
   reason='Immobiliser l’avant-garde';}
 }else if(ability==='spell_heal'){
  if(hpLoss||injured){score=1+Math.min(5,hpLoss)*1.15+Math.min(injured,friends.length*2)*1.2+Math.min(25,urgency)*.2;
   if(hero.hp<=8)score+=8;
   if(context.lethal&&hero.hp+hero.shield+Math.min(5,hpLoss)>context.incoming)score+=20;
   reason='Soigner les blessés';}
 }else if(ability==='spell_buff'){
  if(friends.length){score=1+friends.length*4.2+Math.min(20,urgency)*.18;
   reason='Renforcer la ligne';}
 }else if(ability==='spell_silence'){
  const target=silenceTarget(b,'e',laneInfo.lane);
  if(target){score=3+silenceValue(target.u)*1.2+Math.min(22,urgency)*.35;reason='Neutraliser une capacité dangereuse';}
 }else if(ability==='spell_teleport'){
  const plan=teleportPlan(b,'e',laneInfo.lane),gain=teleportGain(b,'e',plan);
  if(gain>=2){score=5+gain;reason='Repositionner un allié';}
 }else if(ability==='spell_trap'){
  const plan=trapPlan(b,'e',laneInfo.lane);
  if(plan&&threats.some(({u,col})=>col<plan.col&&u.stun<=0&&plan.col-col<=3*(activeAbility(b,u)==='haste'?2:1))){
   score=4+Math.min(20,urgency)*.5;reason='Préparer une embuscade';
  }
 }else if(ability==='spell_hasten'){
  const target=accelerationTarget(b,'e');
  if(target){
   const pending=CARDS[target.card.id],slots=Math.max(0,2-(hero.cardsPlayed||0));
   const canFollow=slots>=2&&target.wait<=2;
   score=5+Math.min(2,target.wait)*2.4;
   if(canFollow&&pending){
    // Le sort prend de la valeur s'il permet de jouer une seconde carte utile.
    const bestLane=Math.max(0,...context.rows.map(row=>pending.type==='unité'&&row.deploymentCol!==undefined
     ?4.4+pending.attack*.65+pending.hp*.17+Math.min(22,row.urgency)*.75:0));
    score+=3+Math.min(17,bestLane)*.8;
    if(pending.type==='sort')score+=4;
    reason='Préparer une seconde carte';
   }else if(slots<=1)score-=4;
   else if(target.wait>2)score-=2;
   if(context.lethal)score-=Math.min(12,context.incoming*2);
   reason=canFollow&&pending?'Préparer une seconde carte':'Accélérer une carte en attente';
  }
 }else if(ability==='spell_slow'){
  // Score fixe : aucune lecture des cartes privées du joueur pour décider.
  score=context.lethal?-20:6-(context.incoming?Math.min(9,context.incoming*1.5):0);
  reason='Ralentir la main adverse';
 }else if(ability==='spell_ward'){
  const room=Math.max(0,15-hero.shield);
  if(room>0){score=room>=5?2+Math.min(5,room)*.5+Math.min(25,urgency)*.38 : -Infinity;
   if(context.incoming>0){
    score+=Math.min(10,context.incoming*1.4);
    if(context.lethal&&hero.hp+hero.shield+Math.min(5,room)>context.incoming)score+=22;
   }
   reason='Protéger la couronne';}
 }
 if(!Number.isFinite(score))return null;
 return {score:finite(score),reason};
}

// Biais explicites, sans dés ni avantage caché. Chaque style dispose des mêmes
// cartes, du même déploiement (2/tour) et des mêmes statistiques de combat.
function personalityBonus(b,card,laneInfo){
 const style=aiStyle(b),{threats,friends,urgency,guard}=laneInfo;
 const allies=friends.filter(({u})=>CARDS[u.id]?.faction===card.faction).length;
 const empty=threats.length===0&&friends.length===0;
 let bonus=0;
 if(style==='assaut'){
  if(card.type==='unité') bonus+=3.4+card.attack*.8+(card.delay<=1?2:0)+(empty?3:0)+(card.ability==='haste'?2:0);
  if(card.ability==='spell_bolt')bonus+=3.5;
  if(card.ability==='spell_heal'||card.ability==='spell_ward')bonus-=4;
 }else if(style==='bastion'){
  if(card.type==='unité')bonus+=Math.min(14,urgency)*.35+(GUARD_IDS.has(card.id)?9:0)+card.hp*.23;
  if(card.ability==='spell_heal')bonus+=7;
  if(card.ability==='spell_ward')bonus+=7;
  if(card.ability==='spell_root'&&threats.length)bonus+=5;
  if(card.ability==='spell_bolt')bonus-=2;
  if(guard&&GUARD_IDS.has(card.id))bonus-=3;
 }else if(style==='rituel'){
  if(card.type==='sort')bonus+=5;
  if(card.ability==='spell_storm'&&threats.length>=2)bonus+=8;
  if(card.ability==='spell_root'&&threats.length)bonus+=5;
  if(card.type==='unité'&&(['ranged','splash','heal'].includes(card.ability)))bonus+=4;
 }else if(style==='meute'){
  if(card.type==='unité')bonus+=2+allies*6+(card.ability==='haste'?3:0)+(empty?1.5:0);
  if(card.type==='sort')bonus-=1;
 }
 if(aiEnraged(b)){
  // À mi-vie, le boss change de PRIORITÉ ; il ne reçoit aucune nouvelle carte.
  if(card.type==='unité')bonus+=2+card.attack*.7+(card.ability==='haste'?2:0);
  if(card.ability==='spell_bolt'||card.ability==='spell_storm')bonus+=6;
  if(card.ability==='spell_heal'||card.ability==='spell_ward')bonus-=4;
 }
 return bonus;
}

// Chaque appel recalcule les options pour tenir compte de la première carte jouée.
// La liste est pure : aucun RNG ni modification du combat, donc facilement testable.
function rankEnemyMoves(b){
 if(!b||b.status!=='active'||!b.heroes?.e)return [];
 const rows=Array.from({length:laneCount(b)},(_,lane)=>inspectEnemyLane(b,lane));
 const results=[];
 // Pas de changement des décisions des rencontres historiques sans sort V2.10.

"src/engine/class-skills.js":function(__exports,__load){
// Effets des compétences de classe : règles isolées du DOM et de la sauvegarde.
// Les unités anciennes sans barrier/rallyUntil restent totalement compatibles.
const {validLane}=__load("src/engine/board.js");
const own=(u,side)=>u&&u.hp>0&&u.side===side;
function allies(b,side,lane){return b.board[lane].filter(u=>own(u,side));}
function enemies(b,side,lane){
 const found=b.board[lane].map((u,col)=>u&&u.hp>0&&u.side!==side?{u,col}:null).filter(Boolean);

}
function classSkillTargetError(b,side,card,lane){
 if(!card.heroClass)return '';
 if(!validLane(b,lane))return 'Ligne invalide.';
 const friendly=allies(b,side,lane),foes=enemies(b,side,lane),h=b.heroes[side];
 switch(card.ability){
  case 'spell_guard_wall':case 'spell_guard_rally':case 'spell_cleric_bless':
   return friendly.length?'':'Cette compétence demande une créature alliée sur la ligne.';
  case 'spell_cleric_light':
   return friendly.some(u=>u.hp<u.maxhp)?'':'Aucun allié blessé sur cette ligne.';
  case 'spell_arc_freeze':case 'spell_arc_chain':case 'spell_ranger_pierce':
   return foes.length?'':'Aucun ennemi sur cette ligne.';
  case 'spell_ranger_draw':
   return h.deck.length||h.discard.length?'':'Aucune carte disponible à piocher.';
  default:return 'Compétence inconnue.';
 }
}
// Les effets sont déterministes ; hit() applique les armures, les barrières et les victimes.
function resolveClassSkill(b,side,card,lane,hit){
 const friends=allies(b,side,lane),foes=enemies(b,side,lane),ability=card.ability;
 if(ability==='spell_guard_wall'){
  for(const u of friends)u.barrier=Math.min(4,(u.barrier||0)+2);
 }else if(ability==='spell_guard_rally'){
  for(const u of friends)u.rallyUntil=Math.max(u.rallyUntil||0,b.round+1);

  return 2;
 }else if(ability==='spell_cleric_light'){

  const target=[...friends].sort((a,z)=>a.hp/a.maxhp-z.hp/z.maxhp||a.uid-z.uid)[0];

},
"src/engine/unit-stats.js":function(__exports,__load){
// Statistiques d'invocation partagées par le moteur et les aperçus, sans mutation.
const {CARDS,FACTIONS}=__load("src/data.js");
const {gearBonus,masteryRank,reputationLevel}=__load("src/engine/profile.js");
function unitStatContext(profile){

  upgrades:{...profile.upgrades},mastery:{...profile.mastery},
  forgeBonus:profile.buildings?.forge||0,unitAtkBonus:gearBonus(profile,'unitAtk'),
  reputationBonus:Object.fromEntries(Object.keys(FACTIONS).map(id=>[id,reputationLevel(profile,id)]))
 };
}

function unitStats(context,id,side='p'){
 const card=CARDS[id];if(!card||card.type!=='unité')return null;
 const allied=side==='p';
 const level=allied?(context.upgrades?.[id]||0):Math.max(0,context.enemyDifficulty-3);
 const equipment=allied?(context.unitAtkBonus||0):0;
 const forge=allied?(context.forgeBonus||0):0;
 const reputation=allied?(context.reputationBonus?.[card.faction]||0):0;
 const mastery=allied&&masteryRank({mastery:context.mastery},id)===3?1:0;
 const bonuses=[
  {label:allied?'Amélioration':'Difficulté',atk:level,hp:level},
  {label:'Équipement',atk:equipment,hp:0},{label:'Forge',atk:0,hp:forge},
  {label:'Réputation',atk:0,hp:reputation},{label:'Maîtrise',atk:0,hp:mastery}
 ].filter(b=>b.atk||b.hp);
 return {atk:card.attack+level+equipment,maxhp:card.hp+level+forge+reputation+mastery,bonuses};
}

Object.assign(__exports,{unitStatContext,unitStats});

},

"src/ui/painted-arena.js":function(__exports,__load){
// Projection graphique de l'illustration approuvée ; aucune règle du moteur.
const {cardArenaEnabled}=__load("src/ui/card-arena.js");
const PAINTED_ARENA = Object.freeze({
 width:1672,height:941,version:'celeste-peinte-v1',
 // Limites des quatre pistes relevées sur l'image originale, de haut en bas.
 rows:[344,421,509,605,716],
 left:[355,331,302,271,238],right:[1319,1341,1370,1400,1432],
 heroes:{p:{x:149,y:559,facing:'right'},e:{x:1522,y:559,facing:'left'}}
});

function paintedTile(visual,col){
 if(!Number.isInteger(visual)||visual<0||visual>3||!Number.isInteger(col)||col<1||col>10)throw new RangeError('Case visuelle hors du plateau 4×10');
 const a=PAINTED_ARENA,y= a.rows[visual],height=a.rows[visual+1]-y;
 const topWidth=(a.right[visual]-a.left[visual])/10,bottomWidth=(a.right[visual+1]-a.left[visual+1])/10;
 const tl=a.left[visual]+(col-1)*topWidth+3,tr=tl+topWidth-6;
 const bl=a.left[visual+1]+(col-1)*bottomWidth+3,br=bl+bottomWidth-6;
 const left=Math.min(tl,bl),width=Math.max(tr,br)-left;
 const footY=y+height*.72,footX=(tl+tr)*.14+(bl+br)*.36;
 const percent=x=>((x-left)/width*100).toFixed(3)+'%';
 const polygon=`polygon(${percent(tl)} 2%,${percent(tr)} 2%,${percent(br)} 98%,${percent(bl)} 98%)`;
 return {left,top:y,width,height,footX,footY,polygon,
  style:`left:${left}px;top:${y}px;width:${width}px;height:${height}px;--tile-shape:${polygon};--foot-x:${percent(footX)};--foot-y:72%`};
}

function paintedArena(lanes,renderCell){
 const a=PAINTED_ARENA;
 const rows=Array.from({length:4},(_,visual)=>{
  const lane=lanes===2?visual-1:visual,active=lane>=0&&lane<lanes;
  const mid=(a.rows[visual]+a.rows[visual+1])/2,left=(a.left[visual]+a.left[visual+1])/2,right=(a.right[visual]+a.right[visual+1])/2;
  const tiles=Array.from({length:10},(_,i)=>active?renderCell(lane,i+1,visual):`<div class="arena-dormant-cell" style="${paintedTile(visual,i+1).style}"></div>`).join('');
  return `<div class="${active?'lane-row arena-active-row':'arena-dormant-row'}" data-visual-lane="${visual}" ${active?'data-crown-col="11"':'aria-hidden="true"'}><div class="lane-label" style="left:${left-60}px;top:${mid-13}px">${['I','II','III','IV'][visual]}</div><div class="${active?'lane-gate':'arena-dormant-gate'}" style="left:${left-35}px;top:${mid-17}px" ${active?'aria-label="Votre couronne"':''}>♜</div>${tiles}<div class="${active?'lane-gate':'arena-dormant-gate'} enemy" style="left:${right+8}px;top:${mid-17}px" ${active?'aria-label="Couronne adverse"':''}>♛</div></div>`;
 }).join('');
 const heroes=Object.entries(a.heroes).map(([side,h])=>`<div class="arena-hero-slot" data-side="${side}" data-facing="${h.facing}" data-animation-state="idle" data-foot-x="${h.x}" data-foot-y="${h.y}" style="left:${h.x}px;top:${h.y}px" aria-hidden="true"><div class="arena-hero-actor"></div></div>`).join('');
 return `<div class="arena-painted-canvas"><div class="arena-painted-frame" data-art-version="${a.version}" data-render-mode="static"><div class="arena-calibrated-art" aria-hidden="true"></div>${rows}${heroes}</div></div>`;
}

function paintedFootPoint(el){
 const frame=el.closest('.arena-painted-frame');
 if(!frame||!el.hasAttribute('data-foot-x'))return null;
 const box=frame.getBoundingClientRect();
 return {x:box.left+Number(el.dataset.footX)*box.width/PAINTED_ARENA.width,
  y:box.top+Number(el.dataset.footY)*box.height/PAINTED_ARENA.height,el};
}

let observer;
function mountPaintedArena(){
 observer?.disconnect();observer=null;
 const grid=document.querySelector('.arena-painted');if(!grid)return;
 const canvas=grid.querySelector('.arena-painted-canvas'),frame=grid.querySelector('.arena-painted-frame');
 const fit=()=>{
  if(grid.closest('[data-card-layout="true"]')){
   // Le plan des pistes tient entre le HUD et la main, même avec quatre lignes.
   // Une seule transformation pour le décor, les cases et les points des VFX.
   const stage=grid.closest('.combat-stage'),dock=stage.querySelector('.combat-hand-dock');
   const hud=stage.querySelector('.battle-hud'),caption=stage.querySelector('.arena-caption');
   const box=grid.getBoundingClientRect();
   const first=PAINTED_ARENA.rows[0],last=PAINTED_ARENA.rows.at(-1);
   const top=Math.max(hud.getBoundingClientRect().bottom,caption.getBoundingClientRect().bottom)-box.top+12;
   const bottom=dock.getBoundingClientRect().top-box.top-14;
   const scale=Math.min(Math.max(grid.clientWidth/PAINTED_ARENA.width,grid.clientHeight/PAINTED_ARENA.height),Math.max(120,bottom-top)/(last-first));
   const width=PAINTED_ARENA.width*scale,height=PAINTED_ARENA.height*scale;
   const offset=Math.min(bottom-last*scale,Math.max(top-first*scale,(grid.clientHeight-height)/2));
   // Recadrer seulement les marges décoratives ; toutes les cases/couronnes restent accessibles.
   const trim=Math.min(Math.max(0,(width-grid.clientWidth)/2),(Math.min(...PAINTED_ARENA.left)-70)*scale);
   canvas.style.width=Math.max(width-2*trim,grid.clientWidth)+'px';canvas.style.height=grid.clientHeight+'px';canvas.style.marginTop='0px';
   frame.style.left=(Math.max(0,(grid.clientWidth-width)/2)-trim)+'px';frame.style.top=offset+'px';
   frame.style.transform=`scale(${scale})`;
  }else{
   const width=Math.max(cardArenaEnabled()?1280:960,Math.min(grid.clientWidth,grid.clientHeight*PAINTED_ARENA.width/PAINTED_ARENA.height));
   const scale=width/PAINTED_ARENA.width,height=PAINTED_ARENA.height*scale;
   canvas.style.width=width+'px';canvas.style.height=height+'px';canvas.style.marginTop=Math.max(0,(grid.clientHeight-height)/2)+'px';
   frame.style.transform=`scale(${scale})`;
  }
 };
 fit();observer=new ResizeObserver(fit);observer.observe(grid);
}

Object.assign(__exports,{PAINTED_ARENA,paintedTile,paintedArena,paintedFootPoint,mountPaintedArena});

},

function boardInspectionData(battle,uid){
 for(let lane=0;lane<(battle?.board?.length||0);lane++)for(let col=1;col<battle.board[lane].length-1;col++){
  const u=battle.board[lane][col];if(!u||String(u.uid)!==String(uid))continue;
  const concord=formationBonus(battle,lane,u),rallied=u.rallyUntil>=battle.round?1:0;
  const statuses=[concord?'Concorde +1 ATQ':'',rallied?'Ralliement +1 ATQ':'',u.armor?'Armure '+u.armor:'',u.barrier?'Barrière '+u.barrier:'',u.poisonTurns?'Poison '+u.poisonTurns+' tour(s)':'',u.stun?'Immobilisation '+u.stun:'',silenced(battle,u)?'Silence : capacités déclenchées suspendues':''].filter(Boolean);

 }

function cardInspectionContent(card,entry,stats,esc,{illustrated=false,board=null}={}){

 const heading=`<div class="inspection-heading">${illustrated?`<span class="inspection-context">${board?'SUR LE PLATEAU':'DANS VOTRE MAIN'}</span>`:`<b>${esc(card.name)}</b>`}<button type="button" data-action="close-inspection" aria-label="Fermer la fiche">×</button></div>`;

 const identity=illustrated?`<div class="inspection-feature"><img class="inspection-art" src="${artSrc(visualFor(card,{cards:true}).art)}" alt="" data-artwork-status="placeholder" draggable="false"><div class="inspection-identity"><h2>${esc(card.name)}</h2><span class="inspection-order">${esc(faction.name)}</span><span class="inspection-rarity">${esc(card.rarity)} · ${esc(card.type)}</span><div class="inspection-readiness">${esc(readiness)}</div>${statistics}</div></div>`:statistics;

}

function previewPosition(anchor,size,viewport,kind){

 let y=kind==='hand'?anchor.top-size.height-gap:anchor.top+(anchor.height-size.height)/2;
 if(kind==='board'&&x+size.width>viewport.width-margin){
  x=anchor.left-size.width-gap;
  if(x<margin){
   if(anchor.top+anchor.height+gap+size.height<=viewport.height-margin)y=anchor.top+anchor.height+gap;
   else if(anchor.top-size.height-gap>=margin)y=anchor.top-size.height-gap;

 if(kind==='hand'&&y<margin){

  else if(anchor.left-size.width-gap>=margin)x=anchor.left-size.width-gap;

function createCardInspection(getContext,esc){

 const key=r=>r.kind+':'+r.id;
 function closeCardInspection(suppressHover=false,sourceKey=null){
