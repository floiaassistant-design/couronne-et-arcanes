.formation-tip{font-size:11px;color:#e4c58a;margin:10px 3px;line-height:1.6}

/* V1.3 : effets de combat synchronisés sur les événements réels du moteur. */
.vfx-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:#c4b69e;padding:10px 4px 4px;flex-wrap:wrap}
.vfx-toggle{cursor:pointer;font:inherit;font-size:11px;letter-spacing:.03em;color:#f4d99a;padding:8px 12px;border-radius:8px;border:1px solid #c4aa7555;background:#1e3541}
.vfx-toggle:hover,.vfx-toggle:focus-visible{border-color:#efce8e;background:#2d4953}


/* Présentation des emplacements d’illustration, sans ancien personnage animé. */
.creature-portrait{background:#142330;isolation:isolate}
.creature-portrait .creature-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 43%;filter:contrast(1.08) saturate(1.1);transition:transform .24s ease,filter .22s ease}
.creature-portrait::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,#07131d9b 100%),linear-gradient(90deg,#06132155,transparent 37%,transparent 75%,#06132144);pointer-events:none}
.unit-card:hover .creature-image{transform:scale(1.08)}
.creature-portrait .portrait-emblem{position:absolute;right:4px;bottom:4px;z-index:2;color:#fff6d7;display:grid;place-items:center;width:23px;height:23px;border-radius:50%;border:1px solid var(--tone);background:#0b1928dd;box-shadow:0 2px 8px #000a;font:normal 15px Georgia,serif}
.unit-card.compact .portrait-emblem{width:18px;height:18px;font-size:12px}
.creature-portrait.role-spell .creature-image{filter:saturate(1.3) brightness(1.16)}
.unit-on-board{gap:1px}
.sprite-stage{position:relative;flex:none;width:calc(100% - 6px);max-width:93px;height:48px;margin-top:4px;display:flex;align-items:center;justify-content:center;isolation:isolate;border-radius:4px;overflow:hidden;background:linear-gradient(0deg,#0d203e42,#ffffff0b);border-bottom:1px solid #ffffff20}
.unit-on-board:has(.formation-badge) .sprite-stage{margin-top:13px;height:39px}
.sprite-figure{height:100%;width:100%;object-fit:cover;object-position:center 45%;filter:drop-shadow(0 3px 2px #001e30bb);transform-origin:center 80%;}
.sprite-aura{position:absolute;bottom:0;left:24%;right:24%;height:7px;border-radius:50%;border:1px solid #e9cf8b7d;box-shadow:0 0 10px #fad08460;background:#d7d7f533;pointer-events:none}
.unit-on-board.enemy .sprite-figure{filter:sepia(.18) saturate(.85) hue-rotate(300deg) drop-shadow(0 3px 3px #29040c)}
.sprite-stage.role-caster .sprite-aura,.sprite-stage.role-support .sprite-aura{box-shadow:0 0 15px #bd97f8b0;background:#a8a8f565;}
.sprite-stage.role-flying .sprite-aura{height:5px;}
.sprite-stage.role-beast .sprite-aura{background:#8cd09057}
.unit-on-board .unit-name{position:relative;z-index:1;font-weight:700}
.unit-on-board .unit-meta{position:relative;z-index:1}
.animations-off .sprite-figure,.animations-off .sprite-aura{animation:none!important}
@media(prefers-reduced-motion:reduce){.sprite-figure,.sprite-aura,.creature-portrait .creature-image{animation:none!important;transition:none!important}}
/* Art portraits occupy the whole tactical tile, not only a small icon. */
.unit-on-board{justify-content:flex-end;gap:2px;padding:3px 3px 4px}
.unit-on-board .sprite-stage,.unit-on-board:has(.formation-badge) .sprite-stage{position:absolute;inset:0;max-width:none;width:100%;height:100%;margin:0;border:0;background:transparent;border-radius:5px}
.unit-on-board .sprite-stage::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,#0b1527ba 100%);pointer-events:none}
.unit-on-board .sprite-figure{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.unit-on-board .sprite-aura{bottom:6px;z-index:1}
.unit-on-board .unit-name{background:#102438ac;border-radius:4px;padding:2px 4px;white-space:normal;line-height:1.05}
.unit-on-board .formation-badge{z-index:3}

.card-traits{display:flex;flex-wrap:wrap;gap:6px;margin:.35rem 0 .2rem}
.trait-pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:.72rem;color:#f2ead8}


/* V1.7 — affiche uniquement la dernière décision effectivement prise par l’adversaire. */
.ai-plan{display:flex;flex-direction:column;gap:5px;padding:12px;border:1px solid rgba(211,174,110,.35);border-radius:12px;background:rgba(211,174,110,.07);margin-bottom:15px;font-size:.82rem}
.ai-plan b{color:#ead1a2}.ai-plan span{color:#e8e3d9}

.enemy-style-tag{margin:5px 0 7px;color:#cdb98a;font-size:.84rem;letter-spacing:.02em}
.ai-personality{margin-bottom:12px;border-left:3px solid #d9a957}

.enemy-ai-profile{display:flex;flex-direction:column;gap:5px;padding:12px;border:1px solid rgba(211,174,110,.35);border-radius:12px;background:rgba(211,174,110,.07);margin-bottom:15px;font-size:.82rem}
.enemy-ai-profile b{color:#ead1a2}.enemy-ai-profile span{color:#e8e3d9}

/* V1.9 — expeditions */
.dungeon-cards{margin-top:20px}
.dungeon-stages{display:grid;gap:8px;margin:15px 0}
.dungeon-stage{display:flex;flex-direction:column;gap:3px;background:rgba(0,0,0,.16);padding:10px 12px;border:1px solid rgba(210,195,148,.15);border-radius:9px}
.dungeon-stage small{color:#bbbec6}
.dungeon-stage.now{border-color:#d2b777;background:rgba(200,153,80,.12)}
.dungeon-run{border:1px solid rgba(218,178,106,.45)}
.dungeon-battle-banner{text-align:center;margin:14px 0 5px;padding:11px;border-radius:8px;background:rgba(208,164,93,.12);border:1px solid rgba(208,164,93,.34);color:#edd29c;font-size:.88rem}

/* V2.0 — three explicit dungeon choices, fully responsive and keyboard-accessible */
.dungeon-event{margin-top:1rem;padding:1rem;border-radius:12px;background:rgba(91,70,39,.18);border:1px solid rgba(220,185,115,.26)}
.dungeon-event p{margin:.4rem 0 1rem;color:var(--muted,#c8bfae)}
.dungeon-event-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.dungeon-event-option{display:flex;flex-direction:column;align-items:flex-start;gap:.45rem;text-align:left;padding:1rem;cursor:pointer;color:inherit;background:rgba(21,28,44,.84);border:1px solid rgba(221,193,130,.35);border-radius:12px;min-height:154px;font:inherit;transition:border-color .15s,transform .15s,background .15s}
.dungeon-event-option:hover,.dungeon-event-option:focus-visible{border-color:#e8c276;background:rgba(52,48,55,.96);transform:translateY(-2px);outline:2px solid transparent}
.dungeon-event-option .event-icon{font-size:2rem;color:#f4d28e}
.dungeon-event-option b{font-size:1rem;color:#f8dfaa}
.dungeon-event-option small{font-size:.84rem;line-height:1.5;color:#e3decd}
@media(max-width:700px){.dungeon-event-options{grid-template-columns:1fr}.dungeon-event-option{min-height:0}}

/* V2.2 — progression de héros et maîtrise des cartes */
.progression-panel{padding:20px}
.progression-panel .split-head{align-items:center}
.mastery-seal{font-size:.72em;color:#ffe3a7;border:1px solid rgba(240,195,114,.65);border-radius:8px;padding:1px 5px;white-space:nowrap}
.mastery-progress{margin:7px 8px 8px;font-size:10px;letter-spacing:.01em;color:#e8dabd}
.mastery-track{height:5px;border-radius:8px;background:rgba(20,15,12,.5);margin-top:5px;overflow:hidden;border:1px solid rgba(220,184,120,.25)}
.mastery-track i{display:block;height:100%;background:linear-gradient(90deg,#ae8e4d,#f2d68c);border-radius:8px}

/* V2.3 : arbre de talents */
.talent-tier-list{display:grid;gap:20px;margin-top:16px}
.talent-tier{border:1px solid rgba(221,186,119,.22);border-radius:12px;background:rgba(11,20,32,.48);padding:16px}
.talent-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.talent-node{border:1px solid rgba(208,191,150,.26);border-radius:10px;padding:15px;background:rgba(255,255,255,.025);display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.talent-node.active{border-color:#d8b877;background:rgba(216,184,119,.12)}
.talent-node.locked{opacity:.62}
.talent-node h3{margin:0;font-size:1rem;color:#f2dfb6}
.talent-node p{margin:0;flex:1;line-height:1.45;font-size:.88rem}
.talent-node .btn{margin-top:5px}
.battle-talents{font-size:.85rem;color:#f4d6a1;margin-bottom:8px}
@media(max-width:600px){.talent-grid{grid-template-columns:1fr}.talent-tier{padding:12px}}

/* V2.6 — Atelier de decks : composants compacts et accessibles. */
.deck-workshop{margin-top:20px}
.deck-preset-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:17px}
.deck-preset-card{display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:15px;border-radius:10px;border:1px solid var(--line);background:#152535}
.deck-preset-card b{font:normal 19px Georgia,serif;color:#f4d5a0}
.deck-preset-card p{font-size:12px;line-height:1.5;color:var(--muted);margin:0;flex:1}
.deck-preset-card small{color:#bed4d3;font-size:11px}
.deck-preset-card .btn{margin-top:5px}
.deck-preview-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:205px;overflow-y:auto;padding:5px;margin:12px 0}
.deck-preview-list>div{border-radius:7px;background:#152535;padding:8px 10px;font-size:12px}
.modal:has(.deck-preview-list){max-height:90vh;overflow-y:auto}
@media(max-width:950px){.deck-preset-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:540px){.deck-preset-grid,.deck-preview-list{grid-template-columns:1fr}}

/* V2.9 : états publics de contrôle, lisibles sur un plateau défilant sur mobile. */
.battle-cell{position:relative}
.terrain-trap{position:absolute;bottom:3px;left:3px;right:3px;z-index:4;padding:3px 2px;border:1px solid #8bccb6;border-radius:4px;background:#102c26;color:#bcf5dd;font-size:9px;font-weight:700;text-align:center;pointer-events:none}
.terrain-trap.enemy{border-color:#e2a080;background:#3d211c;color:#ffd1b6}
.silence-badge{position:absolute;top:22px;left:3px;right:3px;z-index:5;background:#291d42;color:#ede0ff;border:1px solid #baa0e3;border-radius:4px;padding:3px;font-size:10px;text-align:center}
.unit-on-board.silenced .sprite-figure{filter:saturate(.4)}
.control-tip,.teleport-preview{font-size:12px;line-height:1.6;padding:8px 12px;background:#142536;color:#c9e2e6;border-radius:6px}
.teleport-preview{border:1px solid #789eaf}
.hand-panel>*{min-width:0}
@media(max-width:760px){.hand-panel{grid-template-columns:minmax(0,1fr)}}

/* Main de combat : états de tempo lisibles sans masquer les illustrations. */
.unit-card.hand-card{width:140px;min-height:228px;border-width:2px;isolation:isolate;scroll-snap-align:start}
.unit-card.hand-ready{border-color:#8dcca7;box-shadow:inset 0 0 0 1px #10261d,0 6px 18px #0004}
.unit-card.hand-waiting{opacity:1;border-color:#bfa475;background:linear-gradient(160deg,#263039,#141e27);box-shadow:inset 0 0 0 1px #3a3228,0 6px 18px #0004}
.unit-card.hand-waiting .creature-image{filter:saturate(.53) brightness(.78)}
.unit-card.hand-waiting .card-title{color:#dfd0b8}
.unit-card.hand-waiting:hover{transform:none;border-color:#d0b582}
.unit-card.hand-card.hand-ready:hover{transform:translateY(-5px)}
.unit-card.hand-card.selected{border-color:#f2d490;box-shadow:0 0 0 2px #efd08e88,0 9px 24px #0006}
.unit-card.hand-card:focus-visible{outline:3px solid #f6dd9e;outline-offset:3px}
.hand-readiness{display:block;text-align:center;white-space:nowrap;letter-spacing:.07em;font-size:10px;font-weight:800;line-height:1.25;padding:5px 3px;margin:6px 2px 0;border:1px solid transparent;border-radius:5px}
.hand-readiness.ready{background:#174133;color:#d5fbe0;border-color:#6cb58a77}
.hand-readiness.waiting{background:#4c3827;color:#ffe3b4;border-color:#ca9a6277}
.unit-card.hand-card .cooldown-stamp{inset:35px 12px auto auto;display:flex;flex-direction:column;justify-content:center;align-items:center;width:57px;height:57px;padding:4px;border:2px solid #eac688;border-radius:50%;background:#0a1720f2;box-shadow:0 3px 15px #0009;color:#ffe1a9;pointer-events:none}
.unit-card.hand-card .cooldown-stamp b{font:700 29px/1 Georgia,serif}
.unit-card.hand-card .cooldown-stamp small{font:800 8px/1.2 Inter,system-ui,sans-serif;letter-spacing:.08em;margin:2px 0 0}
.hand{scroll-snap-type:x proximity;overscroll-behavior-x:contain}
@keyframes hand-ready-arrive{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@keyframes hand-wait-arrive{from{opacity:.65;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.unit-card.hand-card.timer-motion.hand-ready .hand-readiness{animation:hand-ready-arrive .32s ease-out both}
.unit-card.hand-card.timer-motion.hand-waiting .cooldown-stamp{animation:hand-wait-arrive .32s ease-out both}
body.animations-off .hand-card .hand-readiness,body.animations-off .hand-card .cooldown-stamp{animation:none!important}
@media(max-width:660px){.hand{gap:8px;padding:12px 5px 22px}.unit-card.hand-card{width:130px;min-height:226px}.unit-card.hand-card .cooldown-stamp{right:10px;width:53px;height:53px}.hand-readiness{font-size:10px}}
@media(prefers-reduced-motion:reduce){.hand{scroll-snap-type:none}.hand-card .hand-readiness,.hand-card .cooldown-stamp{animation:none!important}}

/* V2.11 — arène fantasy lo-fi. Dix cases réelles, couronnes hors grille. */
.arena-lofi{background:#151c2c;border:2px solid #5a617a;border-radius:4px;box-shadow:0 4px 0 #090f1b,inset 0 0 0 2px #222c40}
.arena-caption{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#a9c7ca;font:700 11px ui-monospace,monospace;letter-spacing:.08em;padding:15px 5px 10px}
.arena-lofi .battle-grid{position:relative;padding:0 10px 15px;background:linear-gradient(0deg,#273d43 0%,#1e343e 60%,#242d48 100%);border:2px solid #5b6b75;border-radius:2px;overflow-x:auto;scrollbar-color:#8696a5 #161e32;overscroll-behavior-x:contain}
.arena-sky{height:116px;min-width:calc(var(--cells)*78px + 132px);background-image:var(--arena-scene);background-size:100% 116px;background-position:center bottom;background-repeat:no-repeat;border-bottom:3px solid #3b5260;image-rendering:pixelated;position:relative}
.arena-sky::after{content:'';position:absolute;bottom:0;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,#263c4c 0 70px,#354859 70px 76px);opacity:.6;}
.arena-lofi .lane-row{grid-template-columns:24px 44px repeat(var(--cells),minmax(68px,1fr)) 44px;gap:4px;min-width:calc(var(--cells)*78px + 132px);min-height:114px;margin:8px 0 0;position:relative}
.arena-lofi .lane-label{font:700 15px ui-monospace,monospace;color:#a5bac3}
.arena-lofi .battle-cell{min-height:114px;border:1px solid #64797b;border-radius:1px;background:repeating-linear-gradient(0deg,transparent 0 27px,#40535c55 27px 29px),repeating-linear-gradient(90deg,#354e5366 0 25px,#66808022 25px 27px);box-shadow:inset 0 2px 0 #83979b30,inset 0 -4px 0 #142d3880}
.arena-lofi .battle-cell:nth-child(even){background-color:#2d444c}
.arena-lofi .battle-cell.available{border:2px solid #e5c887;background-color:#5a684a;box-shadow:inset 0 0 0 2px #30454d,0 0 10px #b8d17a33}
.arena-lofi .battle-cell.available:hover,.arena-lofi .battle-cell:focus-visible{outline:2px solid #f3d9a5;outline-offset:2px}
.arena-lofi .slot-num{font:700 10px ui-monospace,monospace;color:#b0c5c9;bottom:5px;right:5px}
.arena-lofi .lane-gate{border-radius:0;background:#23384b;border:1px solid #83969a;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:12px}
.arena-lofi .lane-gate b{font:20px Georgia,serif;z-index:2;color:#f5dca8}
.arena-lofi .lane-gate.enemy{background:#34273f;border-color:#947b97}
.pixel-tower{width:24px;height:38px;background:repeating-linear-gradient(0deg,#869c9c 0 7px,#5c7686 7px 9px);border-left:4px solid #4e6579;border-right:4px solid #afbeb0;box-shadow:0 4px 0 #101e2e;position:relative}
.pixel-tower::before{content:'';position:absolute;top:-7px;left:-5px;width:7px;height:9px;background:#acc2b8;box-shadow:10px 0 #acc2b8,20px 0 #acc2b8}
.pixel-tower::after{content:'';position:absolute;bottom:0;left:5px;width:6px;height:13px;background:#18243a;box-shadow:0 -17px #e0cc97}
.enemy .pixel-tower{filter:hue-rotate(90deg) saturate(.65)}
.arena-lofi .unit-on-board,.arena-lofi .unit-on-board.enemy{min-height:112px;justify-content:flex-end;padding:2px 2px 5px;border-radius:0;background:transparent;border:0;overflow:hidden}
.arena-lofi .unit-on-board .sprite-stage,.arena-lofi .unit-on-board:has(.formation-badge) .sprite-stage{inset:9px 0 26px;width:100%;height:auto;border-radius:0;overflow:visible;align-items:flex-end}
.arena-lofi .unit-on-board .sprite-stage::after{display:none}
.arena-lofi .unit-on-board .sprite-figure{width:52px;height:56px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #122334aa);}
.arena-lofi .unit-on-board.enemy .sprite-stage{transform:scaleX(-1)}
.arena-lofi .unit-on-board.silenced .sprite-figure{filter:saturate(.3) brightness(.8)}
.arena-lofi .sprite-aura{bottom:0;height:5px;border-radius:0;left:22%;right:22%;background:#8ac9c633;border-color:#9ec9c9;box-shadow:none}
.arena-lofi .unit-name{font-size:9px;background:#172438e8;border-radius:0;padding:2px;max-width:100%;line-height:1.1}
.arena-lofi .unit-meta{font:700 10px ui-monospace,monospace;line-height:1.2;white-space:normal;text-align:center;color:#f4e3bb}
.arena-lofi .formation-badge{font-size:8px;top:1px;padding:2px;border-radius:0}
.arena-lofi .silence-badge{top:18px;font-size:9px;border-radius:0;padding:2px}
.arena-lofi .terrain-trap{bottom:3px;font-size:8px;border-radius:0;padding:2px;box-shadow:0 2px 0 #0b1f27}
.arena-scroll-hint{font-size:11px;color:#a9bbc6;margin:8px 3px 0}
.animations-off .arena-sky::after{animation:none}
@media(prefers-reduced-motion:reduce){.arena-sky::after{animation:none}}
@media(max-width:700px){.arena-lofi{padding:8px}.arena-lofi .battle-grid{padding-inline:5px}.arena-lofi .battle-hud{gap:9px}.arena-lofi .fighter h3{font-size:13px}.arena-caption{font-size:10px;letter-spacing:0}.arena-lofi .enemy-style-tag{font-size:10px}.arena-lofi .battle-mid{min-width:35px}}


/* Lisibilité des cartes : couleur de rareté prioritaire, distincte de l'état de jeu. */
.unit-card[data-rarity="commun"]{--rarity-border:#c8d8df;--rarity-ink:#172935}
.unit-card[data-rarity="rare"]{--rarity-border:#69dbf9;--rarity-ink:#092735}
.unit-card[data-rarity="épique"]{--rarity-border:#d4a2ff;--rarity-ink:#2b1640}
.unit-card[data-rarity="légendaire"]{--rarity-border:#ffd46b;--rarity-ink:#392602}
.unit-card[data-rarity]{border:3px solid var(--rarity-border);box-shadow:inset 0 0 0 1px #0d1925,0 4px 14px #0007}
.unit-card.hand-card.hand-ready,.unit-card.hand-card.hand-waiting{border-color:var(--rarity-border);box-shadow:inset 0 0 0 1px #111a26,0 5px 14px #0008}
.unit-card.hand-card.selected{border-color:var(--rarity-border);outline:3px solid #fff0c0;outline-offset:2px;box-shadow:0 0 18px #ffdf8955}
.unit-card .card-quality-tag{margin:4px 0 5px;background:var(--rarity-border);color:var(--rarity-ink);font:900 10px/1.25 ui-monospace,monospace;letter-spacing:.1em;text-align:center;padding:4px 3px;border-radius:3px;text-shadow:none}
.unit-card.compact .card-quality-tag{font-size:9px;padding:3px 2px}
.unit-card .card-rarity{font-weight:900;color:var(--rarity-border);font-size:10px;letter-spacing:.04em}
.unit-card.compact .card-rarity{display:block;font-size:8px}
.new-game-classes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:16px 0}
.new-game-classes .btn{white-space:normal;min-height:48px}

/* Plateau : code couleur du propriétaire + Ordre et rareté en toutes lettres. */
.arena-lofi .unit-on-board{--unit-rarity:#c8d8df;--camp-color:#4dc5ec;outline:2px solid var(--unit-rarity);outline-offset:-3px;box-shadow:inset 0 0 0 3px var(--camp-color);border-radius:3px}
.arena-lofi .unit-on-board[data-owner="e"]{--camp-color:#fa727b;background:#4c182646}
.arena-lofi .unit-on-board[data-owner="p"]{background:#16435946}
.arena-lofi .unit-on-board[data-rarity="rare"]{--unit-rarity:#69dbf9}
.arena-lofi .unit-on-board[data-rarity="épique"]{--unit-rarity:#d4a2ff}
.arena-lofi .unit-on-board[data-rarity="légendaire"]{--unit-rarity:#ffd46b}
.arena-lofi .unit-on-board .board-identification{position:absolute;top:2px;left:3px;right:3px;z-index:6;display:flex;flex-direction:column;gap:1px;pointer-events:none;text-align:center}
.arena-lofi .board-owner{display:block;background:#075474;color:#fff;border:1px solid #8decff;font:900 9px/1.1 ui-monospace,monospace;letter-spacing:.04em;padding:2px 0}
.arena-lofi .unit-on-board.enemy .board-owner{background:#8a273c;border-color:#ffa0a7}
.arena-lofi .board-faction{display:block;background:#0a192bf5;color:#fef5df;font:800 9px/1.15 ui-monospace,monospace;padding:1px 0}
.arena-lofi .board-quality{display:block;background:#0a192bf5;color:var(--unit-rarity);font:900 8px/1.1 ui-monospace,monospace;text-transform:uppercase;padding:1px 0}
.arena-lofi .unit-on-board .sprite-stage,.arena-lofi .unit-on-board:has(.formation-badge) .sprite-stage{inset:37px 0 25px}
.arena-lofi .formation-badge{top:48px;left:2px;right:2px;font-size:7px;z-index:7}
.arena-lofi .silence-badge{top:61px;z-index:8}
.arena-lofi .unit-name{font-weight:900;background:#071426f5;color:#fff;font-size:9px;max-height:24px;overflow:hidden}
.arena-lofi .unit-meta{background:#071426ef;color:#fff1d4;font-size:9px}
.arena-legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:800 10px/1.3 ui-monospace,monospace;margin:9px 3px;color:#d5e6e7}
.arena-legend span{padding:5px 7px;background:#112433;border:1px solid #526f80}
.arena-legend .legend-ally{border-color:#64d4ff;color:#b4ecff}
.arena-legend .legend-enemy{border-color:#fa8796;color:#ffbcc2}
@media(max-width:660px){.new-game-classes{grid-template-columns:1fr}.arena-legend{font-size:9px;gap:4px}.unit-card.hand-card .card-quality-tag{font-size:9px}}


/* Arène structurée : quatre pistes constantes. Le sol épouse les vraies cases,
   sans redimensionnement de panoramique et sans interaction sur les pistes dormantes. */
.arena-lofi .battle-grid.arena-structured{
 background:linear-gradient(180deg,#1b2a43 0,#1b3541 116px,#122735 100%);
 border-color:#66766f;
}
.arena-lofi .arena-structured .arena-dormant-row{
 display:grid;
 grid-template-columns:24px 44px repeat(var(--cells),minmax(68px,1fr)) 44px;
 gap:4px;
 min-width:calc(var(--cells)*78px + 132px);
 min-height:114px;
 margin:8px 0 0;
 position:relative;
 align-items:stretch;
 opacity:.42;
 filter:saturate(.42) brightness(.7);
 pointer-events:none;
 user-select:none;
}
.arena-lofi .arena-structured .lane-row{
 background:linear-gradient(90deg,#b2d6b019,transparent 30%,transparent 70%,#b2d6b019);
 box-shadow:inset 3px 0 0 #b6d0ad68,inset -3px 0 0 #b6d0ad68;
}
.arena-lofi .arena-structured .battle-cell,
.arena-lofi .arena-structured .arena-dormant-cell{
 box-sizing:border-box;
 position:relative;
 min-height:114px;
 border:1px solid #c0cbb04d;
 border-radius:1px;
 background-color:#405c58;
 background-image:
  linear-gradient(180deg,#d7d6af32 0 3px,transparent 3px 100%),
  linear-gradient(90deg,#d1dbc02d 0 3px,transparent 3px 100%),
  linear-gradient(90deg,transparent 0 16%,#20353d66 16% 19%,transparent 19% 74%,#21384155 74% 77%,transparent 77%),
  repeating-linear-gradient(0deg,transparent 0 27px,#1b3b4850 27px 30px,transparent 30px 55px),
  linear-gradient(155deg,#6d8170,#47635c 55%,#2c4952);
 box-shadow:inset 0 -4px 0 #122c3899,inset 2px 2px 0 #d3dabc2a;
 image-rendering:pixelated;
}
.arena-lofi .arena-structured .lane-row .battle-cell:nth-child(3n){
 background-color:#385452;
}
.arena-lofi .arena-structured .battle-cell.available{
 border:2px solid #f5e4a7;
 background-image:linear-gradient(#e8c87448,#e8c87448),
  repeating-linear-gradient(90deg,#39524e 0 9px,#49685e 9px 18px);
 box-shadow:inset 0 0 0 2px #213c40,0 0 0 2px #e4c77d99;
}
.arena-lofi .arena-structured .battle-cell.available:hover,
.arena-lofi .arena-structured .battle-cell:focus-visible{
 outline:3px solid #ffe4a0;
 outline-offset:0;
}
.arena-lofi .arena-structured .arena-dormant-gate{
 min-height:114px;
 display:grid;
 place-items:center;
 background:linear-gradient(180deg,#334954,#142934);
 color:#9da89f;
 border:1px solid #74858a;
 font:20px Georgia,serif;
}
.arena-lofi .arena-structured .arena-dormant-gate.enemy{
 background:linear-gradient(180deg,#513946,#211d2d);
}
.arena-lofi .arena-structured .arena-dormant-row .lane-label{
 display:grid;
 place-items:center;
}
.arena-lofi .arena-structured .arena-dormant-cell{
 background-image:
  repeating-linear-gradient(90deg,#121f2c35 0 22px,#33434b3a 22px 44px),
  linear-gradient(155deg,#455752,#263b45);
}
@media(prefers-reduced-motion:reduce){
 .arena-lofi .arena-structured .lane-row,.arena-lofi .arena-structured .arena-dormant-row{transition:none}
}



/* Combat immersif : HUD compact, arène dominante et main ancrée en bas.
   Affecte exclusivement l'écran de combat ; les autres écrans restent inchangés. */
body:has(.combat-screen){overflow:hidden}
body:has(.combat-screen) .topbar,
body:has(.combat-screen) .main-nav,
body:has(.combat-screen) .footer{display:none}
body:has(.combat-screen) #view{
 width:100%;max-width:none;margin:0;padding:0;height:100vh;height:100dvh;
 min-height:0;overflow:hidden
}
.combat-screen{
 width:100%;height:100%;display:flex;flex-direction:column;
 min-height:0;overflow:hidden;background:#0a1523
}
.combat-screen .combat-titlebar{
 flex:none;min-height:44px;margin:0;padding:6px 14px;
 align-items:center;justify-content:space-between;
 border-bottom:1px solid #9f8e6766;
 background:linear-gradient(90deg,#142638,#213345 60%,#142438);
 gap:12px
}
.combat-mission-name{
 margin:1px 0 0;font:600 clamp(14px,1.5vw,19px)/1.15 Georgia,serif;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw
}
.combat-screen .combat-titlebar .kicker{font-size:8px;letter-spacing:.08em}
.combat-screen .combat-titlebar .pill{margin-left:auto;white-space:nowrap;padding:5px 9px;font-size:10px}
.combat-menu-link{
 flex:none;border:1px solid #a1b7bd88;border-radius:5px;
 background:#162d3e;color:#f3e2bd;padding:7px 11px;
 font-size:11px;font-weight:700;white-space:nowrap
}
.combat-menu-link:hover,.combat-menu-link:focus-visible{
 border-color:#f1d48e;outline:2px solid #f1d48e;outline-offset:1px
}
.combat-screen .combat-stage{
 display:block;flex:1 1 auto;min-height:0;max-height:none;overflow:auto;
 width:100%;border:0;border-radius:0;padding:7px 12px 10px;
 box-shadow:none;scrollbar-color:#6a8c9a #142538;
 overscroll-behavior:contain
}
.combat-screen .battle-hud{gap:9px;margin:0 0 3px}
.combat-screen .fighter{
 max-width:none;min-width:0;padding:5px 12px;border-radius:6px;
 background:#0b2030c9
}
.combat-screen .fighter h3{font-size:clamp(11px,1.4vw,16px);margin:0 0 3px}
.combat-screen .fighter .hp-line{font-size:11px;margin-top:3px}
.combat-screen .fighter .hpbar{height:6px}
.combat-screen .battle-mid .turn-n{font-size:27px;line-height:1}
.combat-screen .battle-mid .turn-label{font-size:8px}
.combat-screen .arena-caption{padding:6px 4px 5px;margin:0}
.combat-screen .arena-lofi .battle-grid{
 width:100%;padding-bottom:7px;min-width:0;margin:0;
 overscroll-behavior-x:contain
}
.combat-screen .arena-sky{height:68px;background-size:100% 68px}
.combat-screen .arena-structured .lane-row,
.combat-screen .arena-structured .arena-dormant-row{
 min-height:102px;margin-top:5px
}
.combat-screen .arena-structured .battle-cell,
.combat-screen .arena-structured .arena-dormant-cell,
.combat-screen .arena-structured .arena-dormant-gate{min-height:102px}
.combat-screen .arena-structured .unit-on-board{min-height:100px}
.combat-screen .arena-legend{margin:7px 3px}
.combat-screen .arena-scroll-hint{margin:3px 2px;font-size:10px}
.combat-screen .vfx-controls{padding:4px 2px;font-size:10px}
.combat-screen .control-tip,.combat-screen .teleport-preview{
 margin:6px 0 0;padding:6px 9px;font-size:11px
}
.combat-screen .formation-tip,.combat-screen .battle-tip{margin:5px 2px;font-size:10px}
.combat-hand-dock{
 flex:0 0 clamp(205px,29dvh,260px);height:clamp(205px,29dvh,260px);
 min-height:0;position:relative;z-index:9;
 border-top:2px solid #bea16a;
 background:linear-gradient(180deg,#203347,#101e2d 14%,#071323 100%);
 box-shadow:0 -9px 28px #020912b5;
 padding:6px 12px max(7px,env(safe-area-inset-bottom))
}
.combat-hand-dock .hand-panel{
 height:100%;min-height:0;display:grid;align-items:stretch;
 grid-template-columns:minmax(0,1fr) clamp(165px,18vw,230px);
 gap:12px
}
.combat-hand-dock .hand-panel>div:first-child{
 min-width:0;min-height:0;display:flex;flex-direction:column
}
.combat-hand-dock .hand-header{flex:none;min-height:31px;gap:5px}
.combat-hand-dock .hand-header .section-caption{font-size:11px}
.combat-hand-dock .hand-header .selection-guide{font-size:10px;line-height:1.2}
.combat-hand-dock .hand-header .pill{padding:4px 6px;font-size:10px;white-space:nowrap}
.combat-hand-dock .hand{
 flex:1 1 auto;min-width:0;min-height:0;width:100%;
 display:flex;align-items:stretch;gap:9px;
 overflow-x:auto;overflow-y:hidden;
 scroll-padding:6px;padding:6px 5px 8px;
 scrollbar-color:#b9a47e #162736;
 overscroll-behavior-x:contain
}
.combat-hand-dock .unit-card.hand-card{
 flex:0 0 145px;width:145px;height:100%;min-height:0;
 padding:5px 6px;overflow:hidden
}
.combat-hand-dock .unit-card.hand-card .card-head{font-size:9px;padding:2px 1px 4px}
.combat-hand-dock .unit-card.hand-card .card-quality-tag{margin:2px 0;padding:2px;font-size:9px}
.combat-hand-dock .unit-card.hand-card .portrait{height:68px}
.combat-hand-dock .unit-card.hand-card .card-title{
 font-size:12px;line-height:1.12;min-height:27px;padding:4px 2px 1px;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.combat-hand-dock .unit-card.hand-card .card-detail,
.combat-hand-dock .unit-card.hand-card .card-traits{display:none}
.combat-hand-dock .unit-card.hand-card .hand-readiness{font-size:10px}
.combat-hand-dock .unit-card.hand-card .card-stats{
 margin-top:3px;gap:3px;flex-wrap:wrap
}
.combat-hand-dock .unit-card.hand-card .stat{font-size:10px;padding:3px 4px}
.combat-hand-dock .unit-card.hand-card .cooldown-stamp{
 top:29px;right:6px;width:48px;height:48px
}
.combat-hand-dock .unit-card.hand-card .cooldown-stamp b{font-size:23px}
.combat-hand-dock .actions-side{
 min-height:0;max-height:100%;overflow-y:auto;
 display:flex;flex-direction:column;gap:3px;
 padding:5px 7px;border-radius:6px;align-items:stretch
}
.combat-hand-dock .actions-side>.btn{
 flex-shrink:0;margin:0;padding:9px 6px;
 line-height:1.1;font-size:12px
}
.combat-hand-dock .actions-side>[data-action="end-turn"]{order:-3}
.combat-hand-dock .actions-side>[data-action="hero-power"]{order:-2}
.combat-hand-dock .actions-side>[data-action="retreat"]{order:-1}
.combat-hand-dock .actions-side>.section-caption{font-size:9px;margin-top:3px}
.combat-hand-dock .actions-side>.power-hint{padding:5px;margin:2px 0;font-size:10px}
.combat-hand-dock .actions-side>p{margin:2px 0;font-size:10px;line-height:1.25}
.combat-hand-dock .actions-side .log-list{max-height:86px;font-size:10px}
.combat-hand-dock .actions-side>.enemy-ai-profile,
.combat-hand-dock .actions-side>.ai-plan{font-size:10px;line-height:1.2}
@media(max-width:700px){
 .combat-screen .combat-titlebar{min-height:39px;padding:5px 7px;gap:5px}
 .combat-screen .combat-titlebar .kicker{font-size:8px}
 .combat-mission-name{font-size:13px;max-width:43vw}
 .combat-screen .combat-titlebar .pill{display:none}
 .combat-menu-link{padding:6px;font-size:10px}
 .combat-screen .combat-stage{padding:5px 5px 7px}
 .combat-screen .fighter{padding:5px}
 .combat-screen .fighter h3{font-size:11px}
 .combat-screen .fighter .hp-line{font-size:9px}
 .combat-screen .battle-mid .turn-n{font-size:22px}
 .combat-screen .arena-caption{font-size:10px}
 .combat-hand-dock{padding:4px 5px max(5px,env(safe-area-inset-bottom))}
 .combat-hand-dock .hand-panel{
  grid-template-columns:minmax(0,1fr) 132px;gap:5px
 }
 .combat-hand-dock .unit-card.hand-card{flex-basis:120px;width:120px}
 .combat-hand-dock .unit-card.hand-card .portrait{height:60px}
 .combat-hand-dock .actions-side{padding:3px;gap:2px}
 .combat-hand-dock .actions-side>.btn{font-size:10px;padding:8px 3px}
 .combat-hand-dock .hand-header .selection-guide{font-size:9px}
}
@media(max-height:540px){
 .combat-hand-dock{flex-basis:clamp(137px,40dvh,175px);height:clamp(137px,40dvh,175px)}
 .combat-screen .combat-titlebar{min-height:35px;padding-block:3px}
 .combat-screen .arena-sky{height:42px;background-size:100% 42px}
 .combat-hand-dock .hand-header{min-height:21px}
 .combat-hand-dock .hand-header .selection-guide{display:none}
 .combat-hand-dock .unit-card.hand-card .portrait{height:43px}
 .combat-hand-dock .unit-card.hand-card .card-head{padding:1px}
 .combat-hand-dock .unit-card.hand-card .card-title{min-height:19px;font-size:10px}
 .combat-hand-dock .unit-card.hand-card .card-stats{margin-top:0}
 .combat-hand-dock .unit-card.hand-card .stat{font-size:9px;padding:2px 3px}
 .combat-hand-dock .unit-card.hand-card .card-quality-tag{font-size:8px;margin:1px 0}
 .combat-hand-dock .unit-card.hand-card .hand-readiness{font-size:10px}
}
@media(prefers-reduced-motion:reduce){
 .combat-screen .combat-hand-dock .unit-card,
 .combat-screen .combat-stage{scroll-behavior:auto;transition:none!important}
}

/* Sur bureau standard, garder les quatre pistes dans le viewport au-dessus de la main. */
@media(min-width:960px) and (min-height:650px) and (max-height:960px){
 .combat-screen .arena-sky{height:58px;background-size:100% 58px}
 .combat-screen .arena-structured .lane-row,
 .combat-screen .arena-structured .arena-dormant-row{min-height:98px;margin-top:4px}
 .combat-screen .arena-structured .battle-cell,
 .combat-screen .arena-structured .arena-dormant-cell,
 .combat-screen .arena-structured .arena-dormant-gate{min-height:98px}
 .combat-screen .arena-structured .unit-on-board{min-height:96px}
}

/* Arène céleste calibrée — source graphique distincte, grille UI 4×10 ancrée.
 * Plan 912 × 620 : ciel jusqu'à y=118, 4 rangées de 116px avec écart de 6px.
 * Colonne 1 commence à x=76 : 24 + 44 + 2*4. Pas d'étirement de l'image. */
.arena-lofi .battle-grid.arena-structured{
 padding:0 0 14px;
 min-height:634px;
 position:relative;
 background:linear-gradient(90deg,#12283a,#1a2f45 50%,#12283a);
}
.arena-lofi .arena-structured .arena-calibrated-art{
 position:absolute;top:0;left:max(0px,calc((100% - 912px)/2));
 width:912px;height:620px;z-index:0;
 background-color:#132739;background-repeat:no-repeat;
 background-size:912px 620px;
 pointer-events:none;user-select:none
}
.arena-lofi .arena-structured .arena-sky{
 position:relative;z-index:1;
 width:912px;min-width:912px;height:118px;min-height:118px;
 margin-left:max(0px,calc((100% - 912px)/2));
 background:none;border:0;box-shadow:none
}
.arena-lofi .arena-structured .arena-sky::after{display:none!important}
.arena-lofi .arena-structured .lane-row,
.arena-lofi .arena-structured .arena-dormant-row,
.combat-screen .arena-structured .lane-row,
.combat-screen .arena-structured .arena-dormant-row{
 width:912px;min-width:912px;max-width:912px;
 height:116px;min-height:116px;max-height:116px;
 margin:6px 0 0 max(0px,calc((100% - 912px)/2));
 grid-template-columns:24px 44px repeat(10,minmax(0,1fr)) 44px;
 gap:4px;position:relative;z-index:1;
 background:none;box-shadow:none;
}
.arena-lofi .arena-structured .battle-cell,
.arena-lofi .arena-structured .arena-dormant-cell,
.combat-screen .arena-structured .battle-cell,
.combat-screen .arena-structured .arena-dormant-cell{
 min-height:116px;height:116px;box-shadow:none;
 border:1px solid #e6e0b328;background:transparent;
}
.arena-lofi .arena-structured .lane-row .battle-cell:nth-child(3n){background:transparent}
.arena-lofi .arena-structured .battle-cell.available,
.combat-screen .arena-structured .battle-cell.available{
 background:#ffe7a226;border:2px solid #ffe1a3;
 box-shadow:inset 0 0 0 2px #ffe7ae77,0 0 10px #ffe1a866;
}
.arena-lofi .arena-structured .lane-row .lane-gate{
 min-height:116px;background:#06132220;border-color:#edd6a02b;
}
.arena-lofi .arena-structured .arena-dormant-row{
 opacity:1;filter:none;pointer-events:none;user-select:none;
}
.arena-lofi .arena-structured .arena-dormant-cell{
 background:#0715239e;border:1px solid #b3b5a51a;
}
.arena-lofi .arena-structured .arena-dormant-gate{
 min-height:116px;background:#061526a9;color:#b9c1bf;
}
.arena-lofi .arena-structured .arena-dormant-gate.enemy{background:#1c0d22ad}
.arena-lofi .arena-structured .unit-on-board,
.combat-screen .arena-structured .unit-on-board{min-height:114px}
@media(prefers-reduced-motion:reduce){
 .arena-lofi .arena-structured .arena-calibrated-art{animation:none;transition:none}
}


/* Pilote Illustrée v3, uniquement archer ; direction artistique PR art nº 8 @ fbbcbe8. */

.illustrated-pilot .illustrated-count{right:5px;width:28px;min-height:26px;display:grid;place-items:center}
.illustrated-pilot .illustrated-count b{font-size:18px;line-height:1}
.illustrated-pilot .card-title{margin-top:clamp(135px,12vw,200px);padding:5px 5px 2px;min-height:0;position:relative;text-align:center;background:#112438dd}
.illustrated-pilot .card-detail{position:relative;text-align:center;margin:2px 5px;padding:3px 5px;min-height:0;background:#122a42e3;border:1px solid #bd9d65;border-radius:4px;color:#f5deb2}
.illustrated-pilot .card-traits{position:relative}

<script>
(function(){
'use strict';
const __factories={
"src/app.js":function(__exports,__load){
const {createViews}=__load("src/ui/views.js");
const {createCombatFx}=__load("src/ui/combat-fx.js");
const {mountPaintedArena}=__load("src/ui/painted-arena.js");
const {cardArenaEnabled,setCardArenaMode}=__load("src/ui/card-arena.js");
const {createCardInspection}=__load("src/ui/card-inspection.js");
const {loadProfile,saveProfile,restoreBattle,storeBattle,validateImportedProfile,startNewAdventure,hasPreviousAdventure,restorePreviousAdventure}=__load("src/ui/storage.js");
const {CARDS,FACTIONS,CLASSES,CAMPAIGN,TOWER_MAX,towerMission,cardTraits,CHARGE_IDS,RIPOSTE_IDS}=__load("src/data.js");
const {AI_STYLES,aiStyle,aiEnraged}=__load("src/ai.js");
const {TALENT_TREE,TALENT_LEVELS}=__load("src/talents.js");
const {visualFor,artSrc}=__load("src/visuals.js");
const {DUNGEONS,dungeonById,dungeonStageMission,dungeonBonusMission}=__load("src/dungeons.js");
const {DECK_STYLES,proposeDeck,applyDeckStyle,deckOverview,freshProfile,changeHeroClass,learnClassSkill,normalizeProfile,validateDeck,modifyDeck,createBattle,playPlayerCard,endPlayerTurn,usePower,formationBonus,completeBattle,buyPack,upgradeCard,BUILDINGS,upgradeBuilding,EQUIPMENT,craftEquipment,equipEquipment,chooseHeroTalent,reputationLevel,heroLevel,heroShieldBonus,HERO_MAX_LEVEL,HERO_LEVEL_THRESHOLD,masteryRank,MASTERY_THRESHOLDS,FUSION_RECIPES,FUSION_COSTS,EXTRACTION_SHARDS,extractCard,fuseCard,dungeonUnlocked,beginDungeon,chooseDungeonEvent,nextDungeonBattle,settleDungeonBattle,abandonDungeon}=__load("src/engine.js");
const VFX_KEY='couronnes_arcanes_animations_v13';
let animationsEnabled=(()=>{try{return localStorage.getItem(VFX_KEY)!=='off';}catch{return true;}})();

const $=id=>document.getElementById(id);
let profile=load(),battle=loadBattle(),screen=battle?'battle':'home',selectedCard=-1,collectionFilter='all',collectionOwned=false;
let deferredBattleModal='',battleStorageWarning=false;
const {closeCardInspection,suppressCardInspection,bindCardInspection}=createCardInspection(()=>({battle,screen}),esc);
const {stopBattleFx,playBattleFx}=createCombatFx(()=>({animationsEnabled,screen}));
const {btn,cardUI,homeUI,campaignUI,towerUI,dungeonUI,collectionUI,alchemyUI,forgeUI,guideUI,battleUI,navUI,resourceUI}=createViews(()=>({profile,battle,screen,selectedCard,collectionFilter,collectionOwned,animationsEnabled,previousGameAvailable:hasPreviousAdventure()}));
function load(){return loadProfile();}
function save(){if(!saveProfile(profile))toast('Sauvegarde locale indisponible : exportez votre progression dans le Guide.');}
function loadBattle(){return restoreBattle();}
function persistBattle(){
 const ok=storeBattle(battle);
 if(!ok&&!battleStorageWarning){battleStorageWarning=true;toast('Combat non sauvegardé : vérifiez le stockage local et exportez votre profil.');}
 if(ok)battleStorageWarning=false;
 return ok;
}

// Render combat VFX from actual rules-engine events. These never enter saved battles.
function withBattleFx(operation){
 if(!battle)return;
 battle.vfx=[];const result=operation();const events=battle.vfx;delete battle.vfx;
 selectedCard=-1;persistBattle();
 // Apply and persist the outcome before waiting for cosmetic animations.
 if(battle.status!=='active')settle({deferModal:true});
 render();
 playBattleFx(result?.ok===false?[]:events,()=>{if(deferredBattleModal){showModal(deferredBattleModal);deferredBattleModal='';}});

 if(result?.ok===false)toast(result.reason);
}

function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));}
function num(n){return Math.round(n).toLocaleString('fr-FR');}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2900);}
function showModal(html){$('modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;}
function hideModal(){$('modal-root').innerHTML='';}
function welcome(){if(profile.guideSeen||battle?.status==='active')return;showModal(`<div class="kicker">BIENVENUE DANS LE ROYAUME</div><h2>Votre légende commence ici.</h2><p>Ce jeu se joue intégralement dans votre navigateur. Commencez par une mission : sélectionnez une carte, choisissez une case de départ sur une ligne, puis terminez votre tour. Vos troupes avanceront toutes seules.</p><p>Le jeu se sauvegarde automatiquement sur cet appareil.</p><div class="button-row">${btn('Compris, jouer !','welcome-start','','primary')}${btn('Lire les règles','welcome-guide','','ghost')}</div>`);}
function render(){
 document.body.classList.toggle('card-combat-mode',cardArenaEnabled());
 const arenaScroll=document.querySelector('.battle-grid')?.scrollLeft||0;
 const arenaVertical=document.querySelector('.battle-grid')?.scrollTop||0;
 const handScroll=document.querySelector('.combat-hand-dock .hand')?.scrollLeft||0;
 const stageScroll=document.querySelector('.combat-stage')?.scrollTop||0;
 closeCardInspection();
 stopBattleFx();document.body.classList.toggle('animations-off',!animationsEnabled);
 $('resources').innerHTML=resourceUI();$('nav').innerHTML=navUI();
 $('view').innerHTML=screen==='home'?homeUI():screen==='campaign'?campaignUI():screen==='tower'?towerUI():screen==='dungeons'?dungeonUI():screen==='collection'?collectionUI():screen==='alchemy'?alchemyUI():screen==='forge'?forgeUI():screen==='guide'?guideUI():screen==='battle'&&battle?battleUI():homeUI();
 mountPaintedArena();
 const arena=document.querySelector('.battle-grid');if(arena){arena.scrollLeft=arenaScroll;arena.scrollTop=arenaVertical;}
 const hand=document.querySelector('.combat-hand-dock .hand');if(hand)hand.scrollLeft=handScroll;
 const stage=document.querySelector('.combat-stage');if(stage)stage.scrollTop=stageScroll;
}

function settle({deferModal=false}={}){
 if(!battle||battle.status==='active'||battle.rewardGiven)return;
 // The pending finished battle survives a reload until its profile receipt is saved.
 battle.settlementId ||= [battle.missionId,battle.seed,battle.round,battle.heroes.p.hp,battle.heroes.e.hp].join(':');
 persistBattle();
 if(profile.lastBattleSettlementId===battle.settlementId){
  battle.rewardGiven=true;persistBattle();return;
 }
 const dungeon=battle.mode==='dungeon';
 const mission=dungeon?dungeonStageMission(battle.dungeonId,battle.dungeonStage):battle.mode==='tower'?towerMission(Number(battle.missionId.slice(1))):CAMPAIGN.find(m=>m.id===battle.missionId);
 const nextProfile=JSON.parse(JSON.stringify(profile)),nextBattle=JSON.parse(JSON.stringify(battle));
 const reward=dungeon?settleDungeonBattle(nextProfile,nextBattle):completeBattle(nextProfile,mission,nextBattle);
 nextProfile.lastBattleSettlementId=battle.settlementId;
 if(!saveProfile(nextProfile)){
  toast('Récompense non enregistrée : libérez le stockage et rechargez la page pour réessayer.');
  return;
 }
 profile=nextProfile;battle.rewardGiven=true;battle.progressionGranted=nextBattle.progressionGranted;
 persistBattle();
 if(!deferModal)render();
 const showResult=html=>{if(deferModal)deferredBattleModal=html;else showModal(html);};
 if(!reward?.ok&&dungeon){showResult(`<h2>Expédition interrompue</h2><p>Le combat ne correspond plus à une expédition valide. Aucun butin n'a été versé.</p><div class="button-row">${btn('Retour aux donjons','dungeon-exit','','primary')}</div>`);return;}
 const victory=reward.victory;
 if(dungeon){
  const subtitle=victory?reward.finished?'Donjon terminé !':reward.bonus?'Embuscade vaincue !':'Salle remportée !':'Expédition échouée';
  showResult(`<div class="kicker">${esc(subtitle)}</div><h2>${victory?'Votre équipe est victorieuse !':'Votre troupe doit battre en retraite.'}</h2>
   <p>${victory?reward.finished?'Le boss final est vaincu. Vous avez terminé cette expédition.':reward.choicePending?`Votre souverain reprend son souffle : ${reward.retainedHp} PV. Choisissez une halte avant la prochaine salle.`:`Épreuve remportée : ${reward.retainedHp} PV conservés pour la prochaine salle.`:'Le donjon s’achève ici. Les ressources remportées lors des salles précédentes sont conservées.'}</p>
   <div class="stat-row"><div class="stat-box"><strong>+${reward.gold}</strong><small>Or</small></div><div class="stat-box"><strong>+${reward.shards}</strong><small>Éclats</small></div></div>
   ${reward.heroXp?`<p class="gold">♛ +${reward.heroXp} XP de héros${reward.levelAfter>reward.levelBefore?` · Niveau ${reward.levelAfter} atteint !`:''}${reward.mastered?.length?` · ${reward.mastered.length} carte(s) ont progressé en maîtrise`:''}</p>`:''}
   ${reward.card?`<p class="gold">✦ Première victoire : ${esc(CARDS[reward.card].name)} obtenue !</p>`:''}
   <div class="button-row">${victory&&!reward.finished?(reward.choicePending?btn('✦ Choisir un événement','dungeon-choice-open','','primary'):btn('⚔ Salle suivante','dungeon-next','','primary')):''}${btn('Retour aux donjons','dungeon-exit','','ghost')}</div>`);
  return;
 }

function homeUI(){const next=CAMPAIGN[Math.min(profile.unlocked-1,11)];const cleared=profile.completed.length;
 return `<section class="hero-banner"><div class="hero-copy"><div class="kicker">UN MONDE À RECONQUÉRIR · CHAPITRE I</div><h1>Forgez votre <em>légende.</em></h1><p>Cinq ordres se disputent les frontières du royaume. Collectionnez des créatures, assemblez votre deck et menez vos troupes à la victoire dans des combats tactiques sur deux à quatre lignes.</p><div class="button-row">${btn('⚔ Continuer la campagne','start-next','','primary')}${btn('Découvrir les règles','nav','data-page="guide"','ghost')}${btn('Nouvelle partie · choisir une classe','new-game','','ghost')}${previousGameAvailable?btn('↶ Partie précédente','restore-previous-game','','ghost'):''}</div></div><div class="hero-crest"><div class="crest-ring"><span>♜</span></div><div class="crest-sub">LE SERMENT DES COURONNES</div></div></section>
 <section class="spaced"><div class="card-panel progression-panel"><div class="split-head"><div><div class="section-caption">PROGRESSION DU SOUVERAIN</div><h2 class="section-title">Niveau ${heroLevel(profile)} / ${HERO_MAX_LEVEL}</h2></div><span class="pill">Bouclier de vétéran +${heroShieldBonus(profile)}</span></div><p class="page-sub">${heroLevel(profile)===HERO_MAX_LEVEL?"Maîtrise héroïque maximale atteinte.":`${heroProgress(profile).shown} / ${heroProgress(profile).needed} XP vers le prochain niveau.`} Les niveaux améliorent progressivement la protection, sans ajouter d’attaque aux cartes.</p><div class="progressbar"><span style="width:${heroLevel(profile)===HERO_MAX_LEVEL?100:Math.min(100,heroProgress(profile).percent)}%"></span></div></div></section>
 <section class="spaced stat-row"><div class="stat-box"><strong>${cleared}/12</strong><small>Missions accomplies</small></div><div class="stat-box"><strong>${Object.keys(profile.collection).filter(k=>profile.collection[k]>0).length}/${Object.keys(CARDS).length}</strong><small>Cartes découvertes</small></div><div class="stat-box"><strong>${profile.wins}</strong><small>Victoires</small></div><div class="stat-box"><strong>${profile.deck.length}</strong><small>Cartes du deck</small></div></section>
 <section class="spaced"><div class="split-head"><div><div class="section-caption">Votre prochain défi</div><h2 class="section-title" style="margin-top:8px">${esc(next.name)}</h2></div><span class="pill">Région · ${esc(next.region)}</span></div><div class="card-panel"><p class="page-sub">${esc(next.story)} Affrontez <strong class="gold">${esc(next.enemy)}</strong> et gagnez ${next.reward} pièces d’or et ${next.shards} éclats.</p><div class="progressbar"><span style="width:${cleared/12*100}%"></span></div><div class="button-row">${btn('Jouer cette mission','start-mission',`data-id="${next.id}"`,'primary')}${btn('Voir la campagne','nav','data-page="campaign"','ghost')}</div></div></section>
 <section class="spaced"><h2 class="section-title">Les trois piliers de votre aventure</h2><div class="three-grid"><div class="feature-card"><div class="feature-icon">♜</div><h3>Stratégie vivante</h3><p>Vos créatures avancent et combattent automatiquement. Choisissez le bon moment et la bonne ligne.</p></div><div class="feature-card"><div class="feature-icon">✧</div><h3>Collection & évolution</h3><p>Créez des combinaisons entre factions, améliorez vos unités et débloquez de nouveaux pouvoirs.</p></div><div class="feature-card"><div class="feature-icon">⚑</div><h3>Campagne, Tour & donjons</h3><p>Parcourez douze missions, vingt étages et trois donjons successifs avec des boss.</p></div></div></section>`;
}
function campaignUI(){const groups=[];for(let i=0;i<CAMPAIGN.length;i+=3)groups.push(CAMPAIGN.slice(i,i+3));
 return `<div class="kicker">AVENTURE SOLO · 4 RÉGIONS</div><h1 class="page-title">La grande campagne</h1><p class="page-sub">Traversez les terres des cinq ordres. Chaque victoire offre de l’or, des éclats et, pour une première victoire, une nouvelle carte. Les missions déjà vaincues peuvent être rejouées pour obtenir des ressources.</p>
 ${groups.map(gr=>`<section><h2 class="chapter-heading">${esc(gr[0].region)}</h2><div class="mission-list">${gr.map(m=>{
  const locked=Number(m.id)>profile.unlocked,done=profile.completed.includes(m.id);
  return `<article class="mission ${locked?'locked':''} ${done?'completed':''}"><div class="mission-top"><span>MISSION ${m.id} · ${'✦'.repeat(m.difficulty)}</span><span>${done?'✓ TERMINÉE':locked?'⌁ VERROUILLÉE':m.boss?'♛ BOSS':'À DÉCOUVRIR'}</span></div><h3>${esc(m.name)}</h3><p>${esc(m.story)}</p><p class="enemy-style-tag">Stratégie : ${esc(AI_STYLES[m.aiStyle]?.name||'Équilibré')}${m.boss?' · Boss à deux phases':''}</p><div class="reward">◈ ${m.reward} or &nbsp; ✧ ${m.shards} éclats</div>${btn(locked?'Inaccessible':done?'Rejouer la bataille':'Lancer le combat','start-mission',`data-id="${m.id}" ${locked?'disabled':''}`,locked?'ghost':'primary')}</article>`;}).join('')}</div></section>`).join('')}`;
}
function towerUI(){
 return `<div class="kicker">ÉPREUVES SOLO · 20 ÉTAGES</div><h1 class="page-title">La Tour des Couronnes</h1><p class="page-sub">Progressez étage par étage contre des compositions de decks différentes. Chaque victoire apporte or et éclats ; les gardiens des étages 5, 10, 15 et 20 donnent une carte lors de leur première défaite. La tour se joue entièrement hors ligne.</p>
 <section class="spaced stat-row"><div class="stat-box"><strong>${profile.towerCleared.length}/${TOWER_MAX}</strong><small>Étages vaincus</small></div><div class="stat-box"><strong>${profile.towerUnlocked}</strong><small>Étage accessible</small></div></section>
 <section class="spaced"><div class="mission-list">${Array.from({length:TOWER_MAX},(_,i)=>{const m=towerMission(i+1),locked=i+1>profile.towerUnlocked,done=profile.towerCleared.includes(i+1);return `<article class="mission ${locked?'locked':''} ${done?'completed':''}"><div class="mission-top"><span>ÉTAGE ${i+1} · ${'✦'.repeat(m.difficulty)}</span><span>${done?'✓ VAINCU':locked?'⌁ VERROUILLÉ':m.boss?'♛ GARDIEN':'À DÉFIER'}</span></div><h3>${esc(m.name)}</h3><p>${esc(m.enemy)} · ${m.hp} PV ${m.boss?'· Gardien de palier':''}</p><p class="enemy-style-tag">Stratégie : ${esc(AI_STYLES[m.aiStyle]?.name||'Équilibré')}${m.boss?' · Boss à deux phases':''}</p><div class="reward">◈ ${m.reward} or · ✧ ${m.shards} éclats ${m.unlock?' · Carte spéciale':''}</div>${btn(locked?'Inaccessible':done?'Rejouer l’étage':'Défier l’étage','start-tower',`data-id="${i+1}" ${locked?'disabled':''}`,locked?'ghost':'primary')}</article>`;}).join('')}</div></section>`;

function dungeonUI(){
 const run=profile.dungeonRun,cleared=profile.dungeonCleared||[];
 return `<div class="kicker">EXPÉDITIONS SOLO · 3 DONJONS</div><h1 class="page-title">Les profondeurs des Cinq Ordres</h1>
 <p class="page-sub">Chaque donjon comporte <b>trois combats principaux</b> et se termine par un boss. Vous gardez les PV restants et récupérez <b>6 PV après chaque victoire</b>. Entre deux salles, choisissez entre repos supplémentaire, coffre ou embuscade facultative. Une défaite ou un abandon met fin à l'expédition. Or et éclats gagnés à chaque victoire sont conservés. La carte spéciale est accordée une seule fois par donjon terminé.</p>
 <div class="stat-row spaced"><div class="stat-box"><strong>${cleared.length}/${DUNGEONS.length}</strong><small>Donjons terminés</small></div><div class="stat-box"><strong>${run?`${run.stage+1}/3`:'—'}</strong><small>Étape actuelle</small></div></div>
 ${run?`<section class="card-panel dungeon-run spaced"><div class="kicker">EXPÉDITION EN COURS</div><h2 class="section-title">${esc(dungeonById(run.id)?.name||'Donjon')}</h2>
 <p class="page-sub">${run.phase==='bonus'?'Épreuve facultative : un ennemi plus puissant protège un trésor.':`Prochaine salle : ${esc(dungeonStageMission(run.id,run.stage).name)}`} · ${run.hp===null?'Vie pleine au départ':`♥ ${run.hp}/${run.maxhp} PV conservés`}. Votre deck peut être réorganisé entre les combats.</p>
 ${run.phase==='choice'?`<div class="dungeon-event"><div class="section-caption">CHOISISSEZ VOTRE CHEMIN · SALLE ${run.stage+1}/3</div><p>Un seul choix est possible. Il est enregistré dans votre sauvegarde.</p><div class="dungeon-event-options">
 <button class="dungeon-event-option" type="button" data-action="dungeon-event" data-id="rest"><span class="event-icon">✚</span><b>Repos à l’abri</b><small>Récupérer jusqu’à 10 PV supplémentaires.</small></button>
 <button class="dungeon-event-option" type="button" data-action="dungeon-event" data-id="treasure"><span class="event-icon">◈</span><b>Coffre ancien</b><small>+${35+run.stage*10} or et +${12+run.stage*5} éclats, garantis.</small></button>

 </div></div>`:`<div class="button-row">${btn(run.phase==='bonus'?'⚔ Affronter l’embuscade':'⚔ Continuer l’expédition','dungeon-next','','primary')}</div>`}
 <div class="button-row">${btn('Abandonner le donjon','dungeon-quit','','ghost')}</div></section>`:''}
 <div class="mission-list dungeon-cards">${DUNGEONS.map((d,index)=>{const locked=!dungeonUnlocked(profile,d.id),done=cleared.includes(d.id),active=run?.id===d.id;
  return `<article class="mission dungeon-card ${locked?'locked':''} ${done?'completed':''}"><div class="mission-top"><span>${d.icon} ${esc(d.region)}</span><span>${done?'✓ TERMINÉ':active?'⚔ EN COURS':locked?'⌁ VERROUILLÉ':'OUVERT'}</span></div><h3>${esc(d.name)}</h3><p>${esc(d.description)}</p><div class="dungeon-stages">${d.stages.map((s,i)=>`<div class="dungeon-stage ${active&&run.stage===i?'now':''}"><b>${i+1}. ${esc(s.name)} ${s.boss?'♛':''}</b><small>${esc(s.enemy)} · ${s.hp} PV · ${esc(AI_STYLES[s.aiStyle]?.name||'Équilibré')}</small></div>`).join('')}</div>
  <div class="reward">Récompense finale : ◈ ${d.bonusGold} · ✧ ${d.bonusShards} ${!done?`· ✦ ${esc(CARDS[d.unlock].name)}`:''}</div>
  ${btn(active&&run.phase==='choice'?'Choisissez votre événement ci-dessus':active&&run.phase==='bonus'?'Affronter l’embuscade':active?'Poursuivre le donjon':locked?'Débloquer le précédent':run?'Autre expédition en cours':done?'Rejouer le donjon':'Entrer dans le donjon',active?'dungeon-next':'start-dungeon',`data-id="${d.id}" ${locked||run&&!active||active&&run.phase==='choice'?'disabled':''}`,locked?'ghost':'primary')}
  </article>`}).join('')}</div>`;
}

function collectionUI(){const list=Object.values(CARDS).filter(c=>(collectionFilter==='all'||c.faction===collectionFilter)&&(!collectionOwned||(profile.collection[c.id]||0)>0));
 const counts={};profile.deck.forEach(id=>counts[id]=(counts[id]||0)+1);const invalid=validateDeck(profile);
 const overview=deckOverview(profile.deck),busy=battle?.status==='active';

 const classSkillIds=Object.keys(CLASS_SKILLS).filter(id=>CLASS_SKILLS[id].hero===profile.heroClass);
 const skillsPanel=`<section class="card-panel spaced"><div class="section-caption">V2.8 · COMPÉTENCES EXCLUSIVES</div><h2 class="section-title">Arcanes du ${esc(CLASSES[profile.heroClass].name)}</h2><p class="page-sub">Apprenez des cartes propres à votre classe avec des éclats gagnés en jeu. Une copie par compétence, conservée même après un changement de héros. Retirez les compétences incompatibles du deck avant de changer de classe.</p><div class="card-grid">${classSkillIds.map(id=>{
  const info=CLASS_SKILLS[id],known=(profile.collection[id]||0)>0,ready=heroLevel(profile)>=info.level;
  const label=known?'✓ Apprise':!ready?'Niveau '+info.level+' requis':'Apprendre · '+info.shards+' ✧';
  const attrs='data-id="'+id+'" '+(known||!ready||profile.shards<info.shards||busy?'disabled':'');
  return '<div class="alchemy-recipe">'+cardUI(id)+'<div class="alchemy-action">'+btn(label,'learn-class-skill',attrs,'primary')+'</div></div>';
 }).join('')}</div></section>`;
 const workshop=`<section class="card-panel deck-workshop spaced"><div class="split-head"><div><div class="section-caption">ATELIER DE COMPOSITIONS</div><h2 class="section-title">Quatre stratégies, vos propres cartes</h2></div><span class="pill">Gratuit · sans nouvelles cartes</span></div><p class="page-sub">Découvrez une composition adaptée à votre collection. Prévisualisez toutes les cartes avant de remplacer votre deck. Vous pourrez ensuite le modifier manuellement.</p><div class="deck-preset-grid">${Object.entries(DECK_STYLES).map(([id,style])=>{const proposed=proposeDeck(profile,id);return `<article class="deck-preset-card"><b>${esc(style.name)}</b><p>${esc(style.description)}</p><small>${proposed.ok?`${proposed.overview.total} cartes · ${proposed.overview.units} unités · ${proposed.overview.spells} sorts`:esc(proposed.reason)}</small>${btn('Voir la composition','deck-preview',`data-id="${id}" ${!proposed.ok||busy?'disabled':''}`,'small ghost')}</article>`;}).join('')}</div>${busy?'<div class="hint">Terminez le combat en cours avant de changer de composition.</div>':''}</section>`;
 return `<div class="kicker">VOTRE ARSENAL</div><h1 class="page-title">Collection & deck</h1><p class="page-sub">Possédez des cartes, puis ajoutez-les à votre deck. Vous pouvez construire un jeu entre 12 et 24 cartes : les decks courts sont plus réguliers, les longs offrent davantage d'options.</p>${workshop}${skillsPanel}<div class="collection-layout"><section><div class="library-toolbar"><label class="tiny muted" for="faction">Ordre :</label><select id="faction" class="select" data-control="faction"><option value="all" ${collectionFilter==='all'?'selected':''}>Toutes les cartes</option>${Object.keys(FACTIONS).map(f=>`<option value="${f}" ${collectionFilter===f?'selected':''}>${esc(FACTIONS[f].name)}</option>`).join('')}</select><label class="small"><input type="checkbox" id="owned-only" ${collectionOwned?'checked':''}/> Mes cartes uniquement</label><span class="pill">${list.length} cartes affichées</span></div><div class="card-grid">${list.map(c=>cardUI(c.id,{canEdit:true})).join('')}</div></section><aside class="card-panel deck-aside"><div class="section-caption">Votre composition</div><h2 class="section-title" style="margin-top:9px">Deck actif</h2><div class="stat-row"><div class="stat-box"><strong>${profile.deck.length}</strong><small>Cartes / 24</small></div><div class="stat-box"><strong>${overview.units} / ${overview.spells}</strong><small>Unités / sorts</small></div></div>${invalid?`<div class="hint red">${esc(invalid)}</div>`:`<div class="hint green">Deck valide. Prêt au combat.</div>`}<div class="deck-list">${Object.entries(counts).map(([id,count])=>`<div class="deck-item"><span><span class="gold">${count}×</span> ${esc(CARDS[id].name)}</span><button class="remove" aria-label="Retirer ${esc(CARDS[id].name)}" data-action="deck-remove" data-id="${id}">×</button></div>`).join('')}</div>${btn('⚔ Lancer la campagne','nav','data-page="campaign"','primary')}</aside></div>`;
}
function alchemyUI(){

}

 <section class="spaced"><div class="section-caption">ÉQUIPEMENT DU SOUVERAIN</div><h2 class="section-title" style="margin-top:8px">Forge et équipements</h2><p class="page-sub">Fabriquez vos pièces avec les ressources gagnées en jouant. Une seule pièce équipée par emplacement : arme, armure et relique.</p><div class="forge-grid">${Object.entries(EQUIPMENT).map(([key,item])=>{const owned=profile.equipmentOwned.includes(key),equipped=profile.equipped[item.slot]===key;return `<article class="forge-tile"><div class="glyph">${item.slot==='arme'?'⚔':item.slot==='armure'?'♜':'✧'}</div><h3>${esc(item.name)}</h3><p>${esc(item.desc)}</p><div class="pill">${esc(item.slot)} · ${equipped?'✓ Équipé':owned?'Possédé':'À fabriquer'}</div>${btn(equipped?'Équipé':owned?'Équiper':`Fabriquer · ${item.gold} ◈ + ${item.shards} ✧`,owned?'equip-equipment':'craft-equipment',`data-id="${key}" ${equipped?'disabled':''}`,owned?'ghost':'primary')}</article>`;}).join('')}</div></section>
 <section class="spaced"><div class="section-caption">ALLIANCES ET FIDÉLITÉ</div><h2 class="section-title" style="margin-top:8px">Réputation des Cinq Ordres</h2><p class="page-sub">Les victoires augmentent votre réputation auprès des factions présentes dans votre deck. Chaque palier de 15 points donne +1 PV à leurs unités, jusqu’à +3.</p><div class="forge-grid">${Object.entries(FACTIONS).filter(([k])=>k!=='sort').map(([k,f])=>`<article class="forge-tile"><h3>${esc(f.name)}</h3><div class="pill">${profile.reputation[k]} points · Niveau ${reputationLevel(profile,k)}/3</div><p>Bonus actuel : +${reputationLevel(profile,k)} PV par créature de cet ordre.</p></article>`).join('')}</div></section>

function guideUI(){const steps=[
 ['Choisissez une mission','Ouvrez Campagne, puis lancez le Sentier des Brumes. Le combat commence immédiatement.'],
 ['Observez vos cartes','Chaque carte porte un chiffre de délai (◷). Dans votre main, un compte à rebours indique combien de tours avant de pouvoir la jouer. La couleur et le nom de la rareté sont également visibles sur le cadre.'],
 ['Distinguez les troupes','Sur le plateau, chaque unité affiche VOUS ou ENNEMI, son Ordre (Aube, Sylve, Ombre, Forge ou Éther) et sa rareté. Les quatre classes de héros se choisissent dans l’Atelier.'],
 ['Déployez sur une ligne','Cliquez une carte disponible de votre main, puis une des lignes dorées du plateau. Vos créatures arrivent à gauche.'],
 ['Terminez votre tour','Cliquez « Terminer le tour ». L’IA joue ses cartes, puis les unités avancent et attaquent automatiquement.'],
 ['Protégez votre couronne','Évitez que les créatures adverses atteignent votre porte. Faites tomber les PV du héros ennemi à zéro pour gagner.'],
 ['Activez une formation','Placez au moins deux créatures du même Ordre sur une même ligne : chacune gagne +1 attaque tant que la formation tient. Ce bonus est visible avec ✦ Concorde et fonctionne aussi pour les ennemis.'],
 ['Choisissez vos talents','À partir des niveaux 4 et 8, l’Atelier propose deux voies exclusives par palier. Changez de voie gratuitement entre deux combats. Les talents sélectionnés restent propres à chaque classe.'],
 ['Apprenez les compétences de classe','Dans la Collection, apprenez des cartes réservées à votre classe aux niveaux 3 et 6 en échange d’éclats. Une carte de classe incompatible doit être retirée du deck avant de changer de héros.'],
 ['Contrôlez le terrain','Les six cartes de contrôle sont fabriquables en Alchimie avec l’or et les éclats du jeu, ou obtenables dans les paquets. Silence : suspend Poison, Soin, Inspiration, Impact de zone, Vol de vie, Perforation, Célérité, Charge, Riposte et les capacités de contrôle. Armure, Distance, Vol, Garde, Concorde et bonus déjà appliqués sont conservés. Un tour de répit suit chaque silence ; le poison déjà appliqué continue.'],
 ['Changez de ligne et préparez un piège','Faille : choisissez une ligne d’arrivée ; l’allié le plus avancé d’une autre ligne rejoint la même colonne libre (égalité : ligne la plus haute). La case devant la couronne adverse est exclue. Une téléportation par unité et par tour. Les pièges sont publics, persistent trois résolutions et se déclenchent quand un ennemi entre sur leur case par déplacement ou téléportation ; une case survolée ne les déclenche pas.'],
 ['Maîtrisez le temps','Élan des Heures réduit de deux tours le compteur de votre carte en attente la plus lente. Nœud du Temps ajoute deux tours au compteur d’une carte ennemie sans révéler son identité (maximum six). Ces sorts consomment une action parmi les deux cartes jouables par tour et sont fabricables en Alchimie.'],
 ['Progressez en jouant','Chaque victoire apporte de l’expérience au héros. Les cartes réellement jouées gagnent en maîtrise (les unités reçoivent +1 PV au rang 3 ; les sorts gagnent des insignes). Les niveaux de héros 5 et 9 donnent chacun +1 bouclier.'],
 ['Améliorez votre armée','Chaque victoire apporte de l’or, des éclats et parfois une carte. Modifiez votre deck, équipez votre héros et choisissez votre classe.'],
    ['Gravissez la Tour','La Tour des Couronnes propose 20 épreuves. Les étages de gardiens 5, 10, 15 et 20 peuvent offrir une carte exclusive.'],
    ['Choisissez dans les donjons','Entre deux salles, choisissez un seul événement : repos (+10 PV), coffre garanti, ou embuscade bonus risquée. Une défaite met fin à l’expédition.'],
    ['Gagnez des réputations','Chaque victoire apporte de la réputation aux factions de votre deck. Leurs unités gagnent des PV en atteignant les paliers de réputation.']];
 return `<div class="kicker">LES LOIS DU ROYAUME</div><h1 class="page-title">Apprendre à jouer</h1><p class="page-sub">Pas besoin d’avoir déjà joué à un jeu de cartes tactique. Le principe est simple : poser une carte au bon moment, sur la bonne ligne, puis laisser vos troupes agir.</p><div class="guide-list spaced">${steps.map(([title,desc],i)=>`<div class="guide-step"><div class="step-num">${String(i+1).padStart(2,'0')}</div><div><h3>${title}</h3><p>${desc}</p></div></div>`).join('')}</div>
 <div class="card-panel spaced"><div class="section-caption">RÈGLES AVANCÉES</div><div class="two-grid" style="margin-top:17px"><div><h3>Plateau et capacités</h3><p class="page-sub">Chaque ligne contient <b>10 cases jouables</b>, entre les deux couronnes : 2 lignes en duel, 3 pour les rencontres avancées, 4 contre les boss. Posez vos créatures sur une case libre parmi les trois premières de chaque ligne : 1, 2 ou 3. La zone adverse est symétrique : 10, 9 ou 8. Les anciens combats de 3 lignes de 5 cases conservent leur case d’entrée unique.</p><p class="page-sub"><b>Armure</b> réduit les dégâts. <b>Portée</b> touche à deux cases. <b>Rapidité</b> accélère le déplacement. <b>Poison</b> inflige des dégâts différés. <b>Soin</b> restaure un allié. <b>Éclaboussure</b> touche une seconde cible. <b>Charge</b> donne +2 attaque lorsqu’une unité a avancé pendant ce tour. <b>Riposte</b> inflige 2 dégâts avant armure à un adversaire adjacent qui vient d’attaquer au contact, une seule fois par tour.</p></div><div><h3>Composition du deck</h3><p class="page-sub">Vous pouvez jouer au plus <b>deux cartes par tour</b>. Les cartes lentes sont puissantes mais doivent patienter dans votre main. Mélangez unités rapides, défenses, soutiens et sorts. Les cartes utilisées reviennent lorsque le paquet se reforme.</p></div></div></div><div class="card-panel spaced"><div class="section-caption">SAUVEGARDE & TRANSPORT</div><h2 class="section-title" style="margin-top:9px">Conserver votre progression</h2><p class="page-sub">La partie est enregistrée dans ce navigateur. Vous pouvez aussi exporter un fichier de sauvegarde et l’importer sur un autre appareil. « Nouvelle partie » conserve seulement un emplacement précédent sur cet appareil : exportez votre profil avant de multiplier les essais.</p><div class="button-row">${btn('↓ Exporter ma sauvegarde','export-save','','primary')}${btn('↑ Importer une sauvegarde','import-save','','ghost')}${previousGameAvailable?btn('↶ Reprendre la partie précédente','restore-previous-game','','ghost'):''}<input id="import-file" type="file" accept="application/json,.json" hidden /></div></div><div class="button-row">${btn('Commencer la première mission','start-mission','data-id="01"','primary')}</div>`;
}
 return {homeUI:bind(homeUI),campaignUI:bind(campaignUI),towerUI:bind(towerUI),dungeonUI:bind(dungeonUI),collectionUI:bind(collectionUI),alchemyUI:bind(alchemyUI),forgeUI:bind(forgeUI),guideUI:bind(guideUI)};
